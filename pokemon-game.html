<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pokemon Mini Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
#game { width: 100vw; height: 100vh; position: relative; }

/* Screens */
.scr { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.scr.on { display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* Title */
#scr-title { background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a0a1a 100%); }
.title-logo { position: relative; margin-bottom: 30px; text-align: center; }
.title-logo h1 {
  font-size: clamp(2.5em, 8vw, 5em); color: #ffcc00; letter-spacing: 4px;
  text-shadow: 0 0 30px rgba(255,204,0,0.4), 0 4px 0 #b8860b, 0 5px 10px rgba(0,0,0,0.5);
  animation: titlePulse 3s ease-in-out infinite;
}
.title-logo .sub { color: #6688aa; font-size: clamp(0.9em, 2.5vw, 1.3em); margin-top: 8px; letter-spacing: 6px; }
@keyframes titlePulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.2); } }
.title-stats { color: #556; font-size: 0.85em; margin-top: 12px; }
.title-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.title-particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
.particle {
  position: absolute; width: 4px; height: 4px; background: #ffcc0040; border-radius: 50%;
  animation: float linear infinite;
}
@keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }

/* Buttons */
.btn { padding: 12px 40px; border: none; border-radius: 10px; font-size: 1.05em; cursor: pointer; font-weight: 600; transition: all 0.15s; position: relative; z-index: 1; }
.btn:active { transform: scale(0.96); }
.btn-gold { background: linear-gradient(135deg, #ffcc00, #f0a000); color: #1a1a2e; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
.btn-gold:hover { box-shadow: 0 6px 25px rgba(255,204,0,0.5); }
.btn-gold:disabled { background: #333; color: #666; box-shadow: none; cursor: default; }
.btn-blue { background: linear-gradient(135deg, #2a4a7a, #1a3a6a); color: #ccc; border: 1px solid #3a5a8a; }
.btn-blue:hover { background: linear-gradient(135deg, #3a5a8a, #2a4a7a); }
.btn-red { background: linear-gradient(135deg, #8a2a2a, #6a1a1a); color: #ddd; border: 1px solid #aa3a3a; }
.btn-red:hover { background: linear-gradient(135deg, #9a3a3a, #7a2a2a); }
.btn-green { background: linear-gradient(135deg, #2a6a2a, #1a5a1a); color: #ddd; border: 1px solid #3a8a3a; }

/* Selection */
.sel-title { font-size: clamp(1.2em, 4vw, 1.8em); margin-bottom: 4px; color: #ddd; }
.sel-sub { color: #667; font-size: 0.95em; margin-bottom: 20px; }
.sel-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin: 10px 0; max-width: 700px; }
.sel-card {
  width: 130px; height: 170px; background: linear-gradient(160deg, #141e30, #0f1520);
  border: 2px solid #1e2e4e; border-radius: 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.sel-card::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,204,0,0.05) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.3s;
}
.sel-card:hover::before { opacity: 1; }
.sel-card:hover { border-color: #4a6a9a; transform: translateY(-3px); }
.sel-card.picked { border-color: #ffcc00; background: linear-gradient(160deg, #1a2840, #152030); box-shadow: 0 0 20px rgba(255,204,0,0.15), inset 0 0 30px rgba(255,204,0,0.03); }
.sel-card .spr { font-size: 3.2em; margin-bottom: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.sel-card .nm { font-size: 0.9em; font-weight: 600; }
.sel-card .tp {
  font-size: 0.7em; padding: 2px 10px; border-radius: 8px; margin-top: 5px;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.starter-stats { font-size: 0.65em; color: #556; margin-top: 4px; }

/* Type badges */
.t-fire { background: #c04020; color: #fff; } .t-water { background: #3070c0; color: #fff; }
.t-grass { background: #409030; color: #fff; } .t-electric { background: #c0a020; color: #1a1a2e; }
.t-normal { background: #8a8a68; color: #fff; } .t-poison { background: #803080; color: #fff; }
.t-ground { background: #b09030; color: #fff; } .t-flying { background: #7868b0; color: #fff; }
.t-psychic { background: #e04868; color: #fff; } .t-rock { background: #a08838; color: #fff; }
.t-ice { background: #60b8b8; color: #1a1a2e; } .t-dragon { background: #5028e0; color: #fff; }
.t-ghost { background: #504870; color: #fff; } .t-fighting { background: #903028; color: #fff; }

/* HUD */
#scr-world { flex-direction: column; }
#scr-world.on { display: flex; }
#hud {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 12px; background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.6));
  z-index: 10; width: 100%; min-height: 40px; flex-shrink: 0;
  border-bottom: 1px solid #1a2a3a;
}
.hud-l, .hud-r { display: flex; align-items: center; gap: 10px; font-size: 0.85em; }
.hud-pokemon { display: flex; align-items: center; gap: 4px; }
.hud-hp-bar { width: 60px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.hud-hp-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.hud-btn {
  background: #1a2a4a; border: 1px solid #2a4a6a; color: #aaa; padding: 4px 12px;
  border-radius: 6px; cursor: pointer; font-size: 0.8em; transition: all 0.15s;
}
.hud-btn:hover { background: #2a3a5a; color: #ddd; }
.potion-ct { color: #4a4; font-weight: 600; }
#world-canvas { flex: 1; display: block; image-rendering: pixelated; }

/* Minimap */
#minimap {
  position: fixed; bottom: 60px; right: 10px; width: 120px; height: 120px;
  border: 2px solid #2a3a5a; border-radius: 8px; z-index: 20; background: #0a0a1a;
  opacity: 0.8; display: none;
}
#scr-world.on ~ #minimap, #minimap.vis { display: block; }

/* Battle */
#scr-battle {
  background: linear-gradient(180deg, #5a9ad0 0%, #3a7a40 55%, #2a5a20 100%);
  position: relative; overflow: hidden;
}
.battle-bg-clouds {
  position: absolute; top: 0; left: 0; width: 200%; height: 40%;
  background: repeating-linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 10%, transparent 20%);
  animation: clouds 30s linear infinite;
}
@keyframes clouds { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.b-area { width: 100%; max-width: 700px; padding: 15px; z-index: 1; }

.b-field { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; position: relative; }
.b-side { text-align: center; }
.b-sprite {
  font-size: clamp(3em, 10vw, 6em); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  transition: transform 0.3s, filter 0.3s;
}
.b-sprite.hit { animation: hitShake 0.3s ease-out; }
@keyframes hitShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.b-sprite.atk { animation: atkLunge 0.4s ease-out; }
@keyframes atkLunge { 0% { transform: translateX(0); } 30% { transform: translateX(30px); } 100% { transform: translateX(0); } }
.b-sprite.atk-left { animation: atkLungeLeft 0.4s ease-out; }
@keyframes atkLungeLeft { 0% { transform: translateX(0); } 30% { transform: translateX(-30px); } 100% { transform: translateX(0); } }

.b-info {
  background: linear-gradient(135deg, rgba(10,10,20,0.8), rgba(20,20,40,0.7));
  backdrop-filter: blur(4px); padding: 8px 14px; border-radius: 10px;
  min-width: 160px; border: 1px solid #2a3a5a; margin-bottom: 6px;
}
.b-name { font-weight: 700; font-size: 1em; }
.b-lvl { font-size: 0.75em; color: #8899aa; }
.b-type-badge { font-size: 0.6em; padding: 1px 6px; border-radius: 4px; display: inline-block; margin-left: 4px; vertical-align: middle; }
.hp-bg { width: 100%; height: 8px; background: #1a1a2a; border-radius: 4px; margin-top: 4px; overflow: hidden; }
.hp-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease-out; }
.hp-green { background: linear-gradient(90deg, #30a030, #40c040); }
.hp-yellow { background: linear-gradient(90deg, #b0a020, #d0c030); }
.hp-red { background: linear-gradient(90deg, #c03030, #e04040); }
.hp-txt { font-size: 0.7em; color: #889; margin-top: 2px; }
.xp-bg { width: 100%; height: 4px; background: #1a1a2a; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #3060c0, #5080e0); border-radius: 2px; transition: width 0.5s; }

.b-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; z-index: 1; position: relative; }
.b-actions .btn { min-width: 110px; font-size: 0.95em; padding: 10px 16px; }

#b-log {
  background: linear-gradient(135deg, rgba(5,5,15,0.85), rgba(10,10,25,0.75));
  backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 10px;
  margin-top: 10px; min-height: 50px; max-height: 100px; overflow-y: auto;
  font-size: 0.9em; line-height: 1.6; width: 100%; max-width: 700px;
  border: 1px solid #1a2a3a; z-index: 1; position: relative;
}
#b-log::-webkit-scrollbar { width: 4px; }
#b-log::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 2px; }

/* Damage popup */
.dmg-popup {
  position: absolute; font-weight: 900; font-size: 1.8em; z-index: 50;
  pointer-events: none; animation: dmgFloat 1s ease-out forwards;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.dmg-popup.crit { font-size: 2.2em; color: #ff4444; }
.dmg-popup.heal { color: #44dd44; }
@keyframes dmgFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(0.5); } }

/* Effectiveness flash */
.eff-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 100; animation: flashFade 0.4s ease-out;
}
@keyframes flashFade { 0% { opacity: 0.3; } 100% { opacity: 0; } }

/* Pokeball catch animation */
.catch-anim {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 100; text-align: center;
}
.catch-ball { font-size: 4em; animation: ballShake 0.6s ease-in-out; }
@keyframes ballShake {
  0% { transform: rotate(0) scale(1); } 15% { transform: rotate(-20deg) scale(1.1); }
  30% { transform: rotate(20deg); } 45% { transform: rotate(-15deg); }
  60% { transform: rotate(10deg); } 75% { transform: rotate(-5deg); }
  100% { transform: rotate(0) scale(1); }
}
.catch-result { font-size: 1.3em; font-weight: 700; margin-top: 10px; animation: popUp 0.4s ease-out 0.8s both; }
@keyframes popUp { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

/* Overlays */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(5,5,15,0.92); z-index: 80; flex-direction: column;
  align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto;
}
.overlay.on { display: flex; }
.ov-title { font-size: 1.5em; margin: 10px 0 15px; color: #dda0; font-weight: 700; letter-spacing: 1px; }
.ov-title { color: #ffcc00; }
.ov-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px; width: 100%; max-width: 650px; max-height: calc(100vh - 160px);
  overflow-y: auto; padding: 5px;
}
.ov-grid::-webkit-scrollbar { width: 4px; }
.ov-grid::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 2px; }

.pk-card {
  background: linear-gradient(160deg, #0e1520, #0a1018);
  border: 2px solid #1a2a3a; border-radius: 12px; padding: 10px;
  text-align: center; cursor: pointer; transition: all 0.15s; position: relative;
}
.pk-card:hover { border-color: #3a5a8a; transform: translateY(-2px); }
.pk-card.active { border-color: #40a040; box-shadow: 0 0 12px rgba(64,160,64,0.2); }
.pk-card.ko { opacity: 0.45; }
.pk-card.ko::after {
  content: 'K.O.'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 1.5em; font-weight: 900; color: #cc3333; text-shadow: 0 0 10px rgba(204,51,51,0.5);
}
.pk-card .c-spr { font-size: 2.2em; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.pk-card .c-nm { font-size: 0.8em; font-weight: 600; margin-top: 3px; }
.pk-card .c-lv { font-size: 0.7em; color: #667; }
.pk-card .c-hp { font-size: 0.7em; margin-top: 2px; }
.pk-card .c-hp.green { color: #4a4; } .pk-card .c-hp.red { color: #a33; }
.pk-card .c-stats { font-size: 0.6em; color: #445; margin-top: 2px; }
.pk-card .c-type { display: inline-block; font-size: 0.55em; padding: 1px 6px; border-radius: 4px; margin-top: 3px; }

/* Pokemon detail view */
.pk-detail {
  background: linear-gradient(160deg, #0e1520, #0a1018);
  border: 2px solid #2a3a5a; border-radius: 14px; padding: 20px;
  max-width: 350px; width: 100%; text-align: center; margin-top: 10px;
}
.pk-detail .d-spr { font-size: 4em; }
.pk-detail .d-nm { font-size: 1.3em; font-weight: 700; margin: 5px 0; }
.pk-detail .d-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; font-size: 0.85em; }
.pk-detail .d-stat { background: #0a0f18; padding: 6px; border-radius: 6px; }
.pk-detail .d-stat .label { color: #556; font-size: 0.8em; }
.pk-detail .d-stat .val { font-weight: 700; font-size: 1.1em; }
.pk-detail .d-moves { margin-top: 10px; }
.pk-detail .d-move {
  display: inline-block; padding: 4px 12px; margin: 3px; border-radius: 6px;
  font-size: 0.8em; border: 1px solid #2a3a5a; background: #0a1018;
}

/* Pokedex */
.dex-entry { font-size: 0.6em; color: #445; position: absolute; top: 4px; right: 6px; }

/* Mobile controls */
#mob-ctrl {
  display: none; position: fixed; bottom: 8px; z-index: 50; width: 100%;
  pointer-events: none;
}
#mob-ctrl.vis { display: flex; justify-content: space-between; padding: 0 15px; align-items: flex-end; }
.dpad {
  display: grid; grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px;
  gap: 3px; pointer-events: auto;
}
.dpad-b {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; color: rgba(255,255,255,0.5); font-size: 1.1em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.dpad-b:active { background: rgba(255,255,255,0.2); }
.dpad-e { background: none; border: none; }
.mob-btns { display: flex; gap: 8px; pointer-events: auto; margin-bottom: 20px; }
.mob-ab {
  width: 48px; height: 48px; border-radius: 50%; font-size: 0.7em; font-weight: 700;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15); touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.mob-ab.a-btn { background: rgba(100,200,100,0.15); color: #6c6; }
.mob-ab.b-btn { background: rgba(200,100,100,0.15); color: #c66; }

@media (pointer: coarse) { #mob-ctrl { display: flex; } #mob-ctrl.vis { display: flex; } }
@media (pointer: fine) { #mob-ctrl { display: none !important; } }

/* Level up */
.lvl-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: linear-gradient(135deg, #ffcc00, #f09000);
  color: #1a1a2e; padding: 16px 40px; border-radius: 14px;
  font-size: 1.3em; font-weight: 700; z-index: 200;
  animation: lvlPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none; text-align: center;
  box-shadow: 0 0 40px rgba(255,204,0,0.4);
}
.lvl-popup .lvl-sub { font-size: 0.6em; font-weight: 400; color: #4a3a00; margin-top: 4px; }
@keyframes lvlPop { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }

/* New Pokemon caught */
.caught-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: linear-gradient(135deg, #2060c0, #1050a0);
  color: #fff; padding: 20px 40px; border-radius: 14px;
  font-size: 1.2em; font-weight: 700; z-index: 200;
  animation: lvlPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none; text-align: center;
  box-shadow: 0 0 40px rgba(32,96,192,0.4);
}

/* Transition overlay */
#transition {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 300; pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
#transition.on { opacity: 1; }

/* Encounter flash */
.enc-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #fff; z-index: 200; pointer-events: none;
  animation: encFlash 0.6s ease-out forwards;
}
@keyframes encFlash {
  0% { opacity: 0; } 10% { opacity: 0.8; } 20% { opacity: 0; }
  30% { opacity: 0.6; } 40% { opacity: 0; } 50% { opacity: 0.4; }
  100% { opacity: 0; }
}

/* Sound toggle */
#sound-toggle {
  position: fixed; top: 8px; right: 8px; z-index: 90; background: none;
  border: 1px solid #2a3a5a; color: #667; padding: 4px 8px; border-radius: 6px;
  cursor: pointer; font-size: 0.8em;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 2px; }
</style>
</head>
<body>
<div id="game">
  <div id="transition"></div>

  <!-- TITLE -->
  <div id="scr-title" class="scr on">
    <div class="title-particles" id="particles"></div>
    <div class="title-logo">
      <h1>POKEMON</h1>
      <div class="sub">MINI GAME</div>
    </div>
    <div class="title-btns" id="title-btns">
      <button class="btn btn-gold" onclick="G.toCharSelect()">Neues Spiel</button>
    </div>
    <div class="title-stats" id="title-stats"></div>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="scr-char" class="scr">
    <div class="sel-title">Wahle deinen Trainer</div>
    <div class="sel-sub">Dein Abenteuer wartet</div>
    <div class="sel-grid" id="char-grid"></div>
    <button class="btn btn-gold" id="char-btn" disabled onclick="G.toStarterSelect()">Weiter</button>
  </div>

  <!-- STARTER SELECT -->
  <div id="scr-starter" class="scr">
    <div class="sel-title">Wahle dein Starter-Pokemon</div>
    <div class="sel-sub">Dein erster Partner im Kampf</div>
    <div class="sel-grid" id="starter-grid"></div>
    <div class="pk-detail" id="starter-detail" style="display:none"></div>
    <button class="btn btn-gold" id="start-btn" disabled onclick="G.startNewGame()">Abenteuer beginnen!</button>
  </div>

  <!-- WORLD -->
  <div id="scr-world" class="scr">
    <div id="hud">
      <div class="hud-l">
        <span id="h-trainer"></span>
        <div class="hud-pokemon">
          <span id="h-poke"></span>
          <div class="hud-hp-bar"><div class="hud-hp-fill" id="h-hp-fill"></div></div>
          <span id="h-hp-text" style="font-size:0.75em;color:#889;margin-left:4px;"></span>
        </div>
      </div>
      <div class="hud-r">
        <span class="potion-ct" id="h-potions"></span>
        <span id="h-battles" style="color:#556;font-size:0.8em;"></span>
        <button class="hud-btn" onclick="G.openTeam()">Team</button>
        <button class="hud-btn" onclick="G.openPotions()">Heilen</button>
      </div>
    </div>
    <canvas id="world-canvas"></canvas>
  </div>

  <!-- BATTLE -->
  <div id="scr-battle" class="scr">
    <div class="battle-bg-clouds"></div>
    <div class="b-area">
      <div class="b-field">
        <div class="b-side" id="b-player-side">
          <div class="b-info" id="b-p-info"></div>
          <div class="b-sprite" id="b-p-spr"></div>
        </div>
        <div class="b-side" id="b-enemy-side">
          <div class="b-info" id="b-e-info"></div>

const Audio_ = {
  ctx: null,
  enabled: true,
  init() {
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  play(freq, dur, type, vol) {
    if (!this.enabled || !this.ctx) return;
    this.resume();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  hit()    { this.play(200, 0.15, 'sawtooth', 0.06); setTimeout(() => this.play(150, 0.1, 'sawtooth', 0.04), 80); },
  attack() { this.play(400, 0.1, 'square', 0.05); setTimeout(() => this.play(600, 0.15, 'square', 0.05), 60); },
  catch_() { this.play(523, 0.12, 'sine', 0.06); setTimeout(() => this.play(659, 0.12, 'sine', 0.06), 120); setTimeout(() => this.play(784, 0.2, 'sine', 0.06), 240); },
  fail()   { this.play(300, 0.2, 'sawtooth', 0.05); setTimeout(() => this.play(200, 0.3, 'sawtooth', 0.04), 150); },
  lvlUp()  { [523,587,659,698,784].forEach((f,i) => setTimeout(() => this.play(f, 0.15, 'sine', 0.07), i*80)); },
  click()  { this.play(800, 0.05, 'sine', 0.04); },
  step()   { this.play(100 + Math.random()*50, 0.04, 'triangle', 0.02); },
  encounter() { [400,500,600,500,700].forEach((f,i) => setTimeout(() => this.play(f, 0.1, 'square', 0.06), i*60)); },
  flee()   { this.play(500, 0.1, 'sine', 0.05); setTimeout(() => this.play(350, 0.2, 'sine', 0.04), 100); },
};

  // --- Pokemon creation ---
  stat(base, lv) { return Math.floor((2 * base * lv / 100) + lv + 10); },
  maxHp(base, lv) { return Math.floor((2 * base * lv / 100) + lv + 10 + lv); },

  getMovesForType(type, lv) {
    const pool = MOVES[type] || MOVES.normal;
    const moves = [pool[0]];
    if (lv >= 10 && pool[1]) moves.push(pool[1]);
    if (lv >= 30 && pool[2]) moves.push(pool[2]);
    // add a normal move for coverage
    if (lv >= 5 && type !== 'normal') moves.push(MOVES.normal[0]);
    return moves;
  },

  makePoke(d, lv) {
    const mhp = this.maxHp(d.hp, lv);
    return {
      id: d.id, nm: d.nm, spr: d.spr, t: d.t, lv, xp: 0,
      xpNext: lv * 30 + 60,
      mhp, hp: mhp,
      atk: this.stat(d.atk, lv), def: this.stat(d.def, lv), spd: this.stat(d.spd, lv),
      bHp: d.hp, bAtk: d.atk, bDef: d.def, bSpd: d.spd,
      tier: d.tier,
      moves: this.getMovesForType(d.t, lv),
      evoId: d.evo ? d.evo.to : null,
      evoLv: d.evo ? d.evo.lv : null,
    };
  },

  recalcPoke(p) {
    const d = DB.find(x => x.id === p.id);
    if (!d) return;
    p.mhp = this.maxHp(d.hp, p.lv);
    p.atk = this.stat(d.atk, p.lv);
    p.def = this.stat(d.def, p.lv);
    p.spd = this.stat(d.spd, p.lv);
    p.bHp = d.hp; p.bAtk = d.atk; p.bDef = d.def; p.bSpd = d.spd;
    p.moves = this.getMovesForType(p.t, p.lv);
    p.evoId = d.evo ? d.evo.to : null;
    p.evoLv = d.evo ? d.evo.lv : null;
  },

  tryEvolve(p) {
    if (!p.evoId || !p.evoLv || p.lv < p.evoLv) return false;
    const nd = DB.find(x => x.id === p.evoId);
    if (!nd) return false;
    const oldNm = p.nm;
    p.id = nd.id; p.nm = nd.nm; p.spr = nd.spr; p.t = nd.t; p.tier = nd.tier;
    this.recalcPoke(p);
    p.hp = p.mhp;
    this.showPopup(`${oldNm} entwickelt sich zu ${p.nm}!`, 'caught-popup', 2500);
    Audio_.lvlUp();
    return true;
  },

  lvlUp(p) {
    p.lv++;
    const oldMhp = p.mhp;
    this.recalcPoke(p);
    const hpGain = p.mhp - oldMhp;
    p.hp = Math.min(p.mhp, p.hp + hpGain);
    p.xp = 0;
    p.xpNext = p.lv * 30 + 60;
    this.showPopup(`${p.nm} ist jetzt Level ${p.lv}!<div class="lvl-sub">HP+${hpGain} ATK:${p.atk} DEF:${p.def} SPD:${p.spd}</div>`, 'lvl-popup');
    Audio_.lvlUp();
    setTimeout(() => this.tryEvolve(p), 2200);
  },

  showPopup(html, cls, dur) {
    const el = document.createElement('div');
    el.className = cls || 'lvl-popup';
    el.innerHTML = html;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur || 2000);
  },

  // --- World generation ---
  generateWorld() {
    const W = 80, H = 80;
    this.s.mw = W; this.s.mh = H;
    const m = [];
    for (let y = 0; y < H; y++) {
      m[y] = [];
      for (let x = 0; x < W; x++) {
        const n = Math.random();
        if (n < 0.38) m[y][x] = T.GRASS;
        else if (n < 0.65) m[y][x] = T.TALL;
        else if (n < 0.72) m[y][x] = T.WATER;
        else if (n < 0.80) m[y][x] = T.TREE;
        else if (n < 0.86) m[y][x] = T.ROCK;
        else if (n < 0.90) m[y][x] = T.FLOWER;
        else if (n < 0.94) m[y][x] = T.SAND;
        else m[y][x] = T.PATH;
      }
    }

    // Create natural paths
    const paths = [[Math.floor(H/2), 'h'], [Math.floor(W/2), 'v']];
    for (let i = 0; i < 4; i++) {
      paths.push([Math.floor(Math.random() * (H-10)) + 5, 'h']);
      paths.push([Math.floor(Math.random() * (W-10)) + 5, 'v']);
    }
    paths.forEach(([pos, dir]) => {
      let drift = 0;
      if (dir === 'h') {
        for (let x = 0; x < W; x++) {
          drift += Math.random() < 0.3 ? (Math.random() < 0.5 ? 1 : -1) : 0;
          const py = Math.max(1, Math.min(H-2, pos + drift));
          m[py][x] = T.PATH;
          if (py > 0 && Math.random() < 0.4) m[py-1][x] = T.GRASS;
          if (py < H-1 && Math.random() < 0.4) m[py+1][x] = T.GRASS;
        }
      } else {
        for (let y = 0; y < H; y++) {
          drift += Math.random() < 0.3 ? (Math.random() < 0.5 ? 1 : -1) : 0;
          const px = Math.max(1, Math.min(W-2, pos + drift));
          m[y][px] = T.PATH;
          if (px > 0 && Math.random() < 0.4) m[y][px-1] = T.GRASS;
          if (px < W-1 && Math.random() < 0.4) m[y][px+1] = T.GRASS;
        }
      }
    });

    // Bridges over water on path crossings
    for (let y = 1; y < H-1; y++) {
      for (let x = 1; x < W-1; x++) {
        if (m[y][x] === T.WATER) {
          const adj = [m[y-1][x], m[y+1][x], m[y][x-1], m[y][x+1]];
          if (adj.filter(t => t === T.PATH).length >= 2) m[y][x] = T.BRIDGE;
        }
      }
    }

    // Water bodies (small lakes)
    for (let i = 0; i < 6; i++) {
      const cx = 10 + Math.floor(Math.random() * (W-20));
      const cy = 10 + Math.floor(Math.random() * (H-20));
      const r = 3 + Math.floor(Math.random() * 3);
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx*dx + dy*dy <= r*r + Math.random()*4) {
            const ny = cy+dy, nx = cx+dx;
            if (ny >= 0 && ny < H && nx >= 0 && nx < W) {
              if (m[ny][nx] !== T.PATH && m[ny][nx] !== T.BRIDGE) {
                m[ny][nx] = T.WATER;
              }
            }
          }
        }
      }
      // sand border
      for (let dy = -(r+1); dy <= r+1; dy++) {
        for (let dx = -(r+1); dx <= r+1; dx++) {
          const ny = cy+dy, nx = cx+dx;
          if (ny >= 0 && ny < H && nx >= 0 && nx < W) {
            if (m[ny][nx] !== T.WATER && m[ny][nx] !== T.PATH && m[ny][nx] !== T.BRIDGE) {
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist <= r+1.5 && dist > r-0.5) m[ny][nx] = T.SAND;
            }
          }
        }
      }
    }

    // Clear spawn area
    const sx = Math.floor(W/2), sy = Math.floor(H/2);
    for (let dy = -3; dy <= 3; dy++)
      for (let dx = -3; dx <= 3; dx++) {
        const ny = sy+dy, nx = sx+dx;
        if (ny >= 0 && ny < H && nx >= 0 && nx < W) m[ny][nx] = T.GRASS;
      }
    m[sy][sx] = T.PATH;

    this.s.map = m;
    this.s.px = sx; this.s.py = sy;
  },

  // --- Rendering ---
  renderWorld() {
    const c = this.canvas;
    c.width = window.innerWidth;
    c.height = window.innerHeight - 44;
    const ctx = this.ctx;
    const vw = Math.ceil(c.width / TILE) + 2;
    const vh = Math.ceil(c.height / TILE) + 2;
    const cx = this.s.px - Math.floor(vw / 2);
    const cy = this.s.py - Math.floor(vh / 2);

    for (let vy = 0; vy < vh; vy++) {
      for (let vx = 0; vx < vw; vx++) {
        const mx = cx + vx, my = cy + vy;
        const px = vx * TILE, py = vy * TILE;
        if (mx < 0 || mx >= this.s.mw || my < 0 || my >= this.s.mh) {
          ctx.fillStyle = '#1a3a1a';
          ctx.fillRect(px, py, TILE, TILE);
          continue;
        }
        const t = this.s.map[my][mx];
        ctx.fillStyle = T_COL[t];
        ctx.fillRect(px, py, TILE, TILE);

        ctx.font = `${TILE * 0.65}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tx = px + TILE/2, ty = py + TILE/2;

        if (t === T.TALL) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = '#2a6a1f';
          ctx.fillText('\u{1F33F}', tx, ty);
          ctx.globalAlpha = 1;
        } else if (t === T.WATER) {
          ctx.fillText('\u{1F30A}', tx, ty);
        } else if (t === T.TREE) {
          ctx.fillText('\u{1F332}', tx, ty);
        } else if (t === T.ROCK) {
          ctx.fillText('\u{1FAA8}', tx, ty);
        } else if (t === T.FLOWER) {
          const flowers = ['\u{1F33C}', '\u{1F33A}', '\u{1F337}', '\u{1F339}'];
          ctx.fillText(flowers[(mx*7 + my*13) % flowers.length], tx, ty);
        } else if (t === T.BRIDGE) {
          ctx.fillStyle = '#6a4a2a';
          ctx.fillRect(px+2, py, TILE-4, TILE);
          ctx.strokeStyle = '#4a3a1a';
          ctx.lineWidth = 1;
          ctx.strokeRect(px+2, py, TILE-4, TILE);
        }
      }
    }

    // Player shadow
    const ppx = (this.s.px - cx) * TILE;
    const ppy = (this.s.py - cy) * TILE;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(ppx + TILE/2, ppy + TILE - 2, TILE*0.35, TILE*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    // Player
    ctx.font = `${TILE * 0.85}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.s.char.spr, ppx + TILE/2, ppy + TILE/2 - 2);

    this.renderMinimap();
  },

  renderMinimap() {
    const mc = this.mmCtx;
    const scale = 120 / this.s.mw;
    mc.clearRect(0, 0, 120, 120);
    for (let y = 0; y < this.s.mh; y++) {
      for (let x = 0; x < this.s.mw; x++) {
        mc.fillStyle = T_COL[this.s.map[y][x]];
        mc.fillRect(x * scale, y * scale, Math.ceil(scale), Math.ceil(scale));
      }
    }
    mc.fillStyle = '#ff0';
    mc.fillRect(this.s.px * scale - 1, this.s.py * scale - 1, 3, 3);
  },

  updateHud() {
    this.refreshPotions();
    const a = this.s.team[this.s.active];
    document.getElementById('h-trainer').textContent = `${this.s.char.spr} ${this.s.char.nm}`;
    document.getElementById('h-poke').textContent = a ? `${a.spr} ${a.nm} Lv.${a.lv}` : '';
    const fill = document.getElementById('h-hp-fill');
    if (a) {
      const pct = Math.max(0, a.hp / a.mhp * 100);
      fill.style.width = pct + '%';
      fill.style.background = pct > 50 ? '#40a040' : pct > 25 ? '#b0a020' : '#c03030';
      document.getElementById('h-hp-text').textContent = `${a.hp}/${a.mhp}`;
    }
    document.getElementById('h-potions').textContent = `\u{1F9EA} ${this.s.potions}`;
    document.getElementById('h-battles').textContent = `⚔️ ${this.s.battlesWon}`;
  },

  refreshPotions() {
    const today = new Date().toDateString();
    if (this.s.lastPotDate !== today) {
      this.s.potions = 5;
      this.s.lastPotDate = today;
    }
  },

  // --- Movement ---
  initKeys() {
    const km = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    const held = {};
    document.addEventListener('keydown', e => {
      if (this.s && this.s.inBattle) return;
      if (km[e.key]) {
        e.preventDefault();
        if (!held[e.key]) { held[e.key] = true; this.move(km[e.key][0], km[e.key][1]); }
      }
      if (e.key === 'p' || e.key === 'P') this.openTeam();
      if (e.key === 'h' || e.key === 'H') this.openPotions();
      if (e.key === 'Escape') { this.closeTeam(); this.closePotions(); this.closeSwitch(); }
    });
    document.addEventListener('keyup', e => { held[e.key] = false; });

    // continuous movement
    let moveLoop = null;
    const startLoop = () => {
      if (moveLoop) return;
      moveLoop = setInterval(() => {
        if (this.s && !this.s.inBattle) {
          for (const k of Object.keys(held)) {
            if (held[k] && km[k]) { this.move(km[k][0], km[k][1]); break; }
          }
        }
      }, this.moveDelay);
    };
    const stopLoop = () => { clearInterval(moveLoop); moveLoop = null; };
    document.addEventListener('keydown', startLoop);
    document.addEventListener('keyup', e => {
      if (!Object.values(held).some(v => v)) stopLoop();
    });
  },

  move(dx, dy) {
    if (!this.s || this.s.inBattle) return;
    const now = Date.now();
    if (now - this.lastMove < this.moveDelay) return;
    this.lastMove = now;
    const nx = this.s.px + dx, ny = this.s.py + dy;
    if (nx < 0 || nx >= this.s.mw || ny < 0 || ny >= this.s.mh) return;
    if (!T_WALK.has(this.s.map[ny][nx])) return;
    this.s.px = nx; this.s.py = ny;
    Audio_.step();
    this.renderWorld();
    this.updateHud();
    this.checkEncounter();
  },

  // --- Encounters ---
  checkEncounter() {
    if (this.s.map[this.s.py][this.s.px] !== T.TALL) return;
    if (Math.random() > 0.08) return;
    if (!this.s.team.some(p => p.hp > 0)) return;
    if (this.s.team[this.s.active].hp <= 0) {
      const idx = this.s.team.findIndex(p => p.hp > 0);
      if (idx >= 0) this.s.active = idx;
    }
    this.startBattle();
  },

  wildLevel() {
    const a = this.s.team[this.s.active];
    const base = Math.max(1, a.lv - 3);
    return Math.max(1, base + Math.floor(Math.random() * (6 + Math.floor(this.s.battlesWon / 4))));
  },

  wildTier() {
    const w = this.s.battlesWon;
    const r = Math.random();
    if (w < 5)  return 1;
    if (w < 12) return r < 0.65 ? 1 : 2;
    if (w < 25) return r < 0.20 ? 1 : r < 0.75 ? 2 : 3;
    if (w < 45) return r < 0.05 ? 1 : r < 0.35 ? 2 : r < 0.80 ? 3 : 4;
    return r < 0.30 ? 3 : 4;
  },

  spawnWild() {
    const tier = this.wildTier();
    const pool = DB.filter(d => d.tier === tier);
    const d = pool[Math.floor(Math.random() * pool.length)];
    return this.makePoke(d, this.wildLevel());
  },

  // --- Battle ---
  startBattle() {
    Audio_.encounter();
    this.s.inBattle = true;
    this.battleBusy = false;
    this.s.enemy = this.spawnWild();

    // encounter flash
    const flash = document.createElement('div');
    flash.className = 'enc-flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 700);

    setTimeout(() => {
      this.showScreen('scr-battle');
      setTimeout(() => {
        this.renderBattle();
        this.blog(`Ein wildes ${this.s.enemy.nm} (Lv.${this.s.enemy.lv}) erscheint!`);
        this.renderBattleActions();
      }, 350);
    }, 400);
  },

  renderBattle() {
    const p = this.s.team[this.s.active];
    const e = this.s.enemy;
    document.getElementById('b-p-spr').textContent = p.spr;
    document.getElementById('b-e-spr').textContent = e.spr;

    const pPct = Math.max(0, p.hp / p.mhp * 100);
    const ePct = Math.max(0, e.hp / e.mhp * 100);
    const hpCls = pct => pct > 50 ? 'hp-green' : pct > 25 ? 'hp-yellow' : 'hp-red';
    const xpPct = p.xpNext > 0 ? Math.min(100, p.xp / p.xpNext * 100) : 0;

    document.getElementById('b-p-info').innerHTML = `
      <div class="b-name">${p.nm} <span class="b-type-badge t-${p.t}">${p.t}</span></div>
      <div class="b-lvl">Lv. ${p.lv}</div>
      <div class="hp-bg"><div class="hp-fill ${hpCls(pPct)}" style="width:${pPct}%"></div></div>
      <div class="hp-txt">${p.hp} / ${p.mhp}</div>
      <div class="xp-bg"><div class="xp-fill" style="width:${xpPct}%"></div></div>
    `;
    document.getElementById('b-e-info').innerHTML = `
      <div class="b-name">${e.nm} <span class="b-type-badge t-${e.t}">${e.t}</span></div>
      <div class="b-lvl">Lv. ${e.lv}</div>
      <div class="hp-bg"><div class="hp-fill ${hpCls(ePct)}" style="width:${ePct}%"></div></div>
      <div class="hp-txt">${e.hp} / ${e.mhp}</div>
    `;
  },

  renderBattleActions() {
    const acts = document.getElementById('b-acts');
    if (this.s.battleOver) {
      acts.innerHTML = `<button class="btn btn-gold" onclick="G.endBattle()">Weiter</button>`;
      return;
    }
    const p = this.s.team[this.s.active];
    let html = '';
    p.moves.forEach((m, i) => {
      html += `<button class="btn btn-blue" onclick="G.bAttack(${i})" title="${m.pow} Starke, ${m.acc}% Genauigkeit">${m.name}<span style="font-size:0.7em;display:block;color:#889;">${m.pow} PWR</span></button>`;
    });
    html += `<button class="btn btn-green" onclick="G.bCatch()">Fangen</button>`;
    html += `<button class="btn btn-blue" onclick="G.bSwitch()">Wechseln</button>`;
    html += `<button class="btn btn-red" onclick="G.bRun()">Fliehen</button>`;
    acts.innerHTML = html;
  },

  blog(msg) {
    const log = document.getElementById('b-log');
    log.innerHTML += msg + '<br>';
    log.scrollTop = log.scrollHeight;
  },

  typeMult(at, dt) {
    return (TYPE_EFF[at] && TYPE_EFF[at][dt] !== undefined) ? TYPE_EFF[at][dt] : 1;
  },

  calcDmg(atk, def, move, atkType, defType, atkLv) {
    const mult = this.typeMult(atkType, defType);
    const crit = Math.random() < 0.0625 ? 1.5 : 1;
    const rng = 0.85 + Math.random() * 0.15;
    const base = Math.floor(((2 * atkLv / 5 + 2) * atk * move.pow / def) / 50 + 2);
    return { dmg: Math.max(1, Math.floor(base * mult * crit * rng)), mult, crit: crit > 1 };
  },

  showDmgPopup(side, dmg, crit, heal) {
    const el = document.createElement('div');
    el.className = 'dmg-popup' + (crit ? ' crit' : '') + (heal ? ' heal' : '');
    el.textContent = (heal ? '+' : '-') + dmg;
    el.style.color = heal ? '#44dd44' : (crit ? '#ff4444' : '#ffffff');
    const target = document.getElementById(side === 'player' ? 'b-p-spr' : 'b-e-spr');
    const rect = target.getBoundingClientRect();
    el.style.left = rect.left + rect.width/2 - 20 + 'px';
    el.style.top = rect.top - 10 + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  },

  showEffFlash(mult) {
    if (mult === 1) return;
    const fl = document.createElement('div');
    fl.className = 'eff-flash';
    fl.style.background = mult >= 2 ? 'rgba(255,100,50,0.3)' : mult === 0 ? 'rgba(100,100,100,0.3)' : 'rgba(100,100,255,0.2)';
    document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 400);
  },

  animSprite(side, cls) {
    const el = document.getElementById(side === 'player' ? 'b-p-spr' : 'b-e-spr');
    el.classList.remove('hit', 'atk', 'atk-left');
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 500);
  },

  async bAttack(moveIdx) {
    if (this.s.battleOver || this.battleBusy) return;
    this.battleBusy = true;
    const p = this.s.team[this.s.active];
    const e = this.s.enemy;
    const pMove = p.moves[moveIdx];

    // Speed determines who goes first
    const pFirst = p.spd >= e.spd;
    const first = pFirst ? {a:p, d:e, move:pMove, side:'player', oside:'enemy'} : null;
    const eMove = e.moves[Math.floor(Math.random() * e.moves.length)];
    const second = pFirst ? null : {a:p, d:e, move:pMove, side:'player', oside:'enemy'};

    const doTurn = async (attacker, defender, move, aSide, dSide) => {
      if (attacker.hp <= 0) return false;
      // Accuracy check
      if (Math.random() * 100 > move.acc) {
        this.blog(`${attacker.nm} setzt ${move.name} ein... Daneben!`);
        Audio_.fail();
        await this.wait(500);
        return true;
      }
      const r = this.calcDmg(attacker.atk, defender.def, move, attacker.t, defender.t, attacker.lv);
      this.animSprite(aSide, aSide === 'player' ? 'atk' : 'atk-left');
      Audio_.attack();
      await this.wait(200);
      defender.hp = Math.max(0, defender.hp - r.dmg);
      this.animSprite(dSide, 'hit');
      Audio_.hit();
      this.showDmgPopup(dSide, r.dmg, r.crit);
      this.showEffFlash(r.mult);
      let msg = `${attacker.nm}: ${move.name}! ${r.dmg} Schaden.`;
      if (r.crit) msg += ' Volltreffer!';
      if (r.mult >= 2) msg += ' Sehr effektiv!';
      else if (r.mult > 0 && r.mult < 1) msg += ' Nicht sehr effektiv...';
      else if (r.mult === 0) msg += ' Kein Effekt!';
      this.blog(msg);
      this.renderBattle();
      await this.wait(500);
      return defender.hp > 0;
    };

    if (pFirst) {
      // Player first
      const eLive = await doTurn(p, e, pMove, 'player', 'enemy');
      if (!eLive) { this.battleVictory(); return; }
      const pLive = await doTurn(e, p, eMove, 'enemy', 'player');
      if (!pLive) { this.handleFaint(); return; }
    } else {
      // Enemy first
      const pLive = await doTurn(e, p, eMove, 'enemy', 'player');
      if (!pLive) { this.handleFaint(); return; }
      const eLive = await doTurn(p, e, pMove, 'player', 'enemy');
      if (!eLive) { this.battleVictory(); return; }
    }
    this.battleBusy = false;
    this.renderBattleActions();
  },

  handleFaint() {
    const p = this.s.team[this.s.active];
    this.blog(`${p.nm} ist besiegt!`);
    Audio_.fail();
    const next = this.s.team.findIndex(pk => pk.hp > 0);
    if (next >= 0) {
      this.s.active = next;
      this.blog(`${this.s.team[this.s.active].nm} ubernimmt den Kampf!`);
      this.renderBattle();
      this.battleBusy = false;
      this.renderBattleActions();
    } else {
      this.blog('Alle Pokemon sind besiegt! Du fliehst...');
      this.s.battleOver = true;
      this.battleBusy = false;
      this.renderBattleActions();
    }
  },

  battleVictory() {
    this.s.battleOver = true;
    this.s.battlesWon++;
    const e = this.s.enemy;
    const p = this.s.team[this.s.active];
    const xp = Math.floor(e.lv * 18 + e.tier * 15);
    p.xp += xp;
    this.blog(`${e.nm} besiegt! +${xp} XP`);
    while (p.xp >= p.xpNext) {
      p.xp -= p.xpNext;
      this.lvlUp(p);
      this.blog(`${p.nm} erreicht Level ${p.lv}!`);
    }
    this.renderBattle();
    this.battleBusy = false;
    this.renderBattleActions();
  },

  async bCatch() {
    if (this.s.battleOver || this.battleBusy) return;
    this.battleBusy = true;
    const e = this.s.enemy;
    const hpR = e.hp / e.mhp;
    let rate = (1 - hpR) * 0.55 + 0.08;
    if (e.tier >= 3) rate *= 0.45;
    if (e.tier >= 4) rate *= 0.25;

    this.blog('Du wirfst einen Pokeball...');

    // animation
    const anim = document.createElement('div');
    anim.className = 'catch-anim';
    anim.innerHTML = '<div class="catch-ball">\u{26AA}</div>';
    document.body.appendChild(anim);
    await this.wait(800);

    const caught = Math.random() < rate;
    if (caught) {
      Audio_.catch_();
      anim.innerHTML += `<div class="catch-result" style="color:#44dd44;">${e.nm} wurde gefangen!</div>`;
      this.s.team.push({...e});
      this.s.battleOver = true;
      this.s.battlesWon++;
      const xp = Math.floor(e.lv * 12);
      const p = this.s.team[this.s.active];
      p.xp += xp;
      while (p.xp >= p.xpNext) { p.xp -= p.xpNext; this.lvlUp(p); }
      this.blog(`${e.nm} gefangen! +${xp} XP. Du hast jetzt ${this.s.team.length} Pokemon.`);
    } else {
      Audio_.fail();
      anim.innerHTML += `<div class="catch-result" style="color:#dd4444;">Entkommen!</div>`;
      this.blog(`${e.nm} ist entkommen!`);
    }
    await this.wait(1200);
    anim.remove();

    if (!caught) {
      // enemy counterattack
      const p = this.s.team[this.s.active];
      const eMove = e.moves[Math.floor(Math.random() * e.moves.length)];
      const r = this.calcDmg(e.atk, p.def, eMove, e.t, p.t, e.lv);
      p.hp = Math.max(0, p.hp - r.dmg);
      this.animSprite('player', 'hit');
      Audio_.hit();
      this.showDmgPopup('player', r.dmg, r.crit);
      this.blog(`${e.nm}: ${eMove.name}! ${r.dmg} Schaden.`);
      this.renderBattle();
      if (p.hp <= 0) { this.handleFaint(); return; }
    }
    this.renderBattle();
    this.battleBusy = false;
    this.renderBattleActions();
  },

  bSwitch() {
    if (this.s.battleOver || this.battleBusy) return;
    const alive = this.s.team.filter((p, i) => p.hp > 0 && i !== this.s.active);
    if (alive.length === 0) { this.blog('Kein anderes Pokemon verfugbar!'); return; }
    const ov = document.getElementById('ov-switch');
    ov.classList.add('on');
    const g = document.getElementById('switch-grid');
    g.innerHTML = '';
    this.s.team.forEach((p, i) => {
      if (i === this.s.active || p.hp <= 0) return;
      const c = this.makePkCard(p, i, false);
      c.onclick = async () => {
        Audio_.click();
        this.s.active = i;
        ov.classList.remove('on');
        this.blog(`${p.nm} wird eingewechselt!`);
        this.renderBattle();
        // enemy free attack
        await this.wait(300);
        const e = this.s.enemy;
        const pl = this.s.team[this.s.active];
        const eMove = e.moves[Math.floor(Math.random() * e.moves.length)];
        const r = this.calcDmg(e.atk, pl.def, eMove, e.t, pl.t, e.lv);
        pl.hp = Math.max(0, pl.hp - r.dmg);
        this.animSprite('player', 'hit');
        Audio_.hit();
        this.showDmgPopup('player', r.dmg, r.crit);
        this.blog(`${e.nm}: ${eMove.name}! ${r.dmg} Schaden.`);
        this.renderBattle();
        if (pl.hp <= 0) this.handleFaint();
        this.renderBattleActions();
      };
      g.appendChild(c);
    });
  },
  closeSwitch() { document.getElementById('ov-switch').classList.remove('on'); },

  async bRun() {
    if (this.s.battleOver || this.battleBusy) return;
    this.battleBusy = true;
    const p = this.s.team[this.s.active];
    const chance = Math.max(0.2, Math.min(0.95, 0.5 + (p.spd - this.s.enemy.spd) * 0.01));
    if (Math.random() < chance) {
      Audio_.flee();
      this.blog('Erfolgreich geflohen!');
      this.s.battleOver = true;
      this.battleBusy = false;
      this.renderBattleActions();
    } else {
      this.blog('Flucht fehlgeschlagen!');
      await this.wait(300);
      const e = this.s.enemy;
      const eMove = e.moves[Math.floor(Math.random() * e.moves.length)];
      const r = this.calcDmg(e.atk, p.def, eMove, e.t, p.t, e.lv);
      p.hp = Math.max(0, p.hp - r.dmg);
      this.animSprite('player', 'hit');
      Audio_.hit();
      this.showDmgPopup('player', r.dmg, r.crit);
      this.blog(`${e.nm}: ${eMove.name}! ${r.dmg} Schaden.`);
      this.renderBattle();
      if (p.hp <= 0) { this.handleFaint(); return; }
      this.battleBusy = false;
      this.renderBattleActions();
    }
  },

  endBattle() {
    Audio_.click();
    this.s.inBattle = false;
    this.s.battleOver = false;
    document.getElementById('b-log').innerHTML = '';
    this.showScreen('scr-world');
    setTimeout(() => {
      this.renderWorld();
      this.updateHud();
      this.saveGame();
    }, 350);
  },

  wait(ms) { return new Promise(r => setTimeout(r, ms)); },

  // --- Team & Potions ---
  makePkCard(p, i, showActive) {
    const c = document.createElement('div');
    const isActive = showActive && i === this.s.active;
    c.className = `pk-card${isActive ? ' active' : ''}${p.hp <= 0 ? ' ko' : ''}`;
    const hpPct = p.mhp > 0 ? p.hp / p.mhp : 0;
    c.innerHTML = `
      <div class="c-spr">${p.spr}</div>
      <div class="c-nm">${p.nm}</div>
      <span class="c-type t-${p.t}">${p.t}</span>
      <div class="c-lv">Lv. ${p.lv}</div>
      <div class="c-hp ${hpPct > 0.5 ? 'green' : 'red'}">HP: ${p.hp}/${p.mhp}</div>
      <div class="c-stats">ATK:${p.atk} DEF:${p.def} SPD:${p.spd}</div>
      ${p.evoId ? `<div style="font-size:0.55em;color:#556;margin-top:2px;">Evo Lv.${p.evoLv}</div>` : ''}
    `;
    return c;
  },

  openTeam() {
    if (this.s.inBattle) return;
    Audio_.click();
    const ov = document.getElementById('ov-team');
    ov.classList.add('on');
    this.renderTeamGrid();
  },
  closeTeam() { document.getElementById('ov-team').classList.remove('on'); document.getElementById('team-detail').innerHTML = ''; },

  renderTeamGrid() {
    const g = document.getElementById('team-grid');
    g.innerHTML = '';
    this.s.team.forEach((p, i) => {
      const c = this.makePkCard(p, i, true);
      c.onclick = () => {
        Audio_.click();
        if (p.hp > 0) {
          this.s.active = i;
          this.renderTeamGrid();
          this.updateHud();
          this.showTeamDetail(p);
        }
      };
      g.appendChild(c);
    });
  },

  showTeamDetail(p) {
    const det = document.getElementById('team-detail');
    const xpPct = p.xpNext > 0 ? Math.min(100, p.xp / p.xpNext * 100) : 0;
    det.innerHTML = `
      <div class="pk-detail">
        <div class="d-spr">${p.spr}</div>
        <div class="d-nm">${p.nm} <span class="b-type-badge t-${p.t}">${p.t}</span></div>
        <div style="font-size:0.85em;color:#889;">Level ${p.lv}</div>
        <div class="d-stats">
          <div class="d-stat"><div class="label">HP</div><div class="val">${p.hp}/${p.mhp}</div></div>
          <div class="d-stat"><div class="label">ATK</div><div class="val">${p.atk}</div></div>
          <div class="d-stat"><div class="label">DEF</div><div class="val">${p.def}</div></div>
          <div class="d-stat"><div class="label">SPD</div><div class="val">${p.spd}</div></div>
        </div>
        <div style="font-size:0.8em;color:#889;margin:6px 0;">XP: ${p.xp}/${p.xpNext}</div>
        <div class="xp-bg" style="width:80%;margin:0 auto;"><div class="xp-fill" style="width:${xpPct}%"></div></div>
        <div class="d-moves" style="margin-top:10px;">
          ${p.moves.map(m => `<span class="d-move">${m.name} <span style="color:#889;font-size:0.85em;">${m.pow}/${m.acc}%</span></span>`).join('')}
        </div>
        ${p.evoId ? `<div style="margin-top:8px;font-size:0.8em;color:#889;">Entwickelt sich ab Lv.${p.evoLv}</div>` : '<div style="margin-top:8px;font-size:0.8em;color:#556;">Vollstandig entwickelt</div>'}
      </div>
    `;
  },

  openPotions() {
    if (this.s.inBattle) return;
    Audio_.click();
    this.refreshPotions();
    const ov = document.getElementById('ov-potions');
    ov.classList.add('on');
    document.getElementById('pot-info').textContent = `Heiltranke: ${this.s.potions}/5 (Werden taglich aufgefullt)`;
    this.renderPotGrid();
  },
  closePotions() { document.getElementById('ov-potions').classList.remove('on'); },

  renderPotGrid() {
    const g = document.getElementById('pot-grid');
    g.innerHTML = '';
    this.s.team.forEach((p, i) => {
      const need = p.hp < p.mhp;
      const c = this.makePkCard(p, i, false);
      if (!need) c.classList.add('active');
      const info = document.createElement('div');
      info.style.cssText = 'font-size:0.7em;margin-top:4px;';
      if (need && this.s.potions > 0) {
        info.textContent = 'Klick zum Heilen';
        info.style.color = '#4a4';
        c.onclick = () => {
          Audio_.click();
          p.hp = p.mhp;
          this.s.potions--;
          document.getElementById('pot-info').textContent = `Heiltranke: ${this.s.potions}/5`;
          this.renderPotGrid();
          this.updateHud();
          this.saveGame();
        };
      } else if (!need) {
        info.textContent = 'Voll geheilt';
        info.style.color = '#556';
      } else {
        info.textContent = 'Keine Tranke';
        info.style.color = '#a33';
      }
      c.appendChild(info);
      g.appendChild(c);
    });
  },

  // --- Save/Load ---
  saveGame() {
    try {
      localStorage.setItem('pkmn-save', JSON.stringify({
        char: this.s.char, team: this.s.team, active: this.s.active,
        potions: this.s.potions, lastPotDate: this.s.lastPotDate,
        battlesWon: this.s.battlesWon, px: this.s.px, py: this.s.py,
        map: this.s.map, mw: this.s.mw, mh: this.s.mh,
      }));
    } catch(e) {}
  },

  loadGame() {
    try {
      const r = localStorage.getItem('pkmn-save');
      if (!r) return false;
      const d = JSON.parse(r);
      if (!d.char || !d.team || !d.map) return false;
      this.s = {
        char: d.char, team: d.team, active: d.active || 0,
        potions: d.potions !== undefined ? d.potions : 5,
        lastPotDate: d.lastPotDate || null,
        battlesWon: d.battlesWon || 0,
        px: d.px, py: d.py, map: d.map, mw: d.mw, mh: d.mh,
        inBattle: false, battleOver: false, enemy: null,
      };
      // recalc all pokemon stats (in case DB changed)
      this.s.team.forEach(p => this.recalcPoke(p));
      return true;
    } catch(e) { return false; }
  },

  // --- Start ---
  startNewGame() {
    Audio_.click();
    this.s = {
      char: this._charChoice,
      team: [this.makePoke(this._starterChoice, 5)],
      active: 0, potions: 5, lastPotDate: new Date().toDateString(),
      battlesWon: 0, px: 0, py: 0, map: [], mw: 0, mh: 0,
      inBattle: false, battleOver: false, enemy: null,
    };
    this.generateWorld();
    this.showScreen('scr-world');
    setTimeout(() => {
      this.renderWorld();
      this.updateHud();
      this.saveGame();
    }, 350);
  },

  resumeGame() {
    Audio_.click();
    this.refreshPotions();
    if (this.s.team[this.s.active].hp <= 0) {
      const idx = this.s.team.findIndex(p => p.hp > 0);
      if (idx >= 0) this.s.active = idx;
    }
    this.showScreen('scr-world');
    setTimeout(() => {
      this.renderWorld();
      this.updateHud();
    }, 350);
  },
};

// ===================== BOOT =====================
G.init();
</script>
