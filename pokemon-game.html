<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pokemon Mini Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
#game { width: 100vw; height: 100vh; position: relative; }
.scr { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.scr.on { display: flex; flex-direction: column; align-items: center; justify-content: center; }

#scr-title { background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a0a1a 100%); }
.title-logo { position: relative; margin-bottom: 30px; text-align: center; }
.title-logo h1 { font-size: clamp(2.5em,8vw,5em); color: #ffcc00; letter-spacing: 4px; text-shadow: 0 0 30px rgba(255,204,0,0.4), 0 4px 0 #b8860b; animation: tp 3s ease-in-out infinite; }
.title-logo .sub { color: #6688aa; font-size: clamp(0.9em,2.5vw,1.3em); margin-top: 8px; letter-spacing: 6px; }
@keyframes tp { 0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)} }
.title-stats { color: #556; font-size: 0.85em; margin-top: 12px; }
.title-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.title-particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
.particle { position: absolute; width: 4px; height: 4px; background: #ffcc0040; border-radius: 50%; animation: fl linear infinite; }
@keyframes fl { 0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0} }

.btn { padding: 12px 40px; border: none; border-radius: 10px; font-size: 1.05em; cursor: pointer; font-weight: 600; transition: all 0.15s; position: relative; z-index: 1; }
.btn:active { transform: scale(0.96); }
.btn-gold { background: linear-gradient(135deg, #ffcc00, #f0a000); color: #1a1a2e; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
.btn-gold:hover { box-shadow: 0 6px 25px rgba(255,204,0,0.5); }
.btn-gold:disabled { background: #333; color: #666; box-shadow: none; cursor: default; }
.btn-blue { background: linear-gradient(135deg, #2a4a7a, #1a3a6a); color: #ccc; border: 1px solid #3a5a8a; }
.btn-blue:hover { background: linear-gradient(135deg, #3a5a8a, #2a4a7a); }
.btn-red { background: linear-gradient(135deg, #8a2a2a, #6a1a1a); color: #ddd; border: 1px solid #aa3a3a; }
.btn-red:hover { background: linear-gradient(135deg, #9a3a3a, #7a2a2a); }
.btn-green { background: linear-gradient(135deg, #2a6a2a, #1a5a1a); color: #ddd; border: 1px solid #3a8a3a; }

.sel-title { font-size: clamp(1.2em, 4vw, 1.8em); margin-bottom: 4px; color: #ddd; }
.sel-sub { color: #667; font-size: 0.95em; margin-bottom: 20px; }
.sel-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin: 10px 0; max-width: 700px; }
.sel-card { width: 130px; height: 170px; background: linear-gradient(160deg, #141e30, #0f1520); border: 2px solid #1e2e4e; border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; position: relative; overflow: hidden; }
.sel-card:hover { border-color: #4a6a9a; transform: translateY(-3px); }
.sel-card.picked { border-color: #ffcc00; background: linear-gradient(160deg, #1a2840, #152030); box-shadow: 0 0 20px rgba(255,204,0,0.15); }
.sel-card .spr { font-size: 3.2em; margin-bottom: 6px; }
.sel-card .nm { font-size: 0.9em; font-weight: 600; }
.sel-card .tp { font-size: 0.7em; padding: 2px 10px; border-radius: 8px; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.starter-stats { font-size: 0.65em; color: #556; margin-top: 4px; }

.t-fire{background:#c04020;color:#fff}.t-water{background:#3070c0;color:#fff}.t-grass{background:#409030;color:#fff}
.t-electric{background:#c0a020;color:#1a1a2e}.t-normal{background:#8a8a68;color:#fff}.t-poison{background:#803080;color:#fff}
.t-ground{background:#b09030;color:#fff}.t-flying{background:#7868b0;color:#fff}.t-psychic{background:#e04868;color:#fff}
.t-rock{background:#a08838;color:#fff}.t-ice{background:#60b8b8;color:#1a1a2e}.t-dragon{background:#5028e0;color:#fff}
.t-ghost{background:#504870;color:#fff}.t-fighting{background:#903028;color:#fff}

#scr-world { flex-direction: column; }
#scr-world.on { display: flex; }
#hud { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.6)); z-index: 10; width: 100%; min-height: 40px; flex-shrink: 0; border-bottom: 1px solid #1a2a3a; }
.hud-l, .hud-r { display: flex; align-items: center; gap: 10px; font-size: 0.85em; }
.hud-pokemon { display: flex; align-items: center; gap: 4px; }
.hud-hp-bar { width: 60px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.hud-hp-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.hud-btn { background: #1a2a4a; border: 1px solid #2a4a6a; color: #aaa; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em; transition: all 0.15s; }
.hud-btn:hover { background: #2a3a5a; color: #ddd; }
.potion-ct { color: #4a4; font-weight: 600; }
#world-canvas { flex: 1; display: block; }

#minimap { position: fixed; bottom: 60px; right: 10px; width: 140px; height: 140px; border: 2px solid #2a3a5a; border-radius: 8px; z-index: 20; background: #0a0a1a; opacity: 0.85; display: none; }
#scr-world.on ~ #minimap { display: block; }

#scr-battle { background: linear-gradient(180deg, #5a9ad0 0%, #3a7a40 55%, #2a5a20 100%); position: relative; overflow: hidden; }
.battle-bg-clouds { position: absolute; top: 0; left: 0; width: 200%; height: 40%; background: repeating-linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 10%, transparent 20%); animation: cl 30s linear infinite; }
@keyframes cl { 0%{transform:translateX(0)}100%{transform:translateX(-50%)} }
.b-area { width: 100%; max-width: 700px; padding: 15px; z-index: 1; }
.b-field { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; position: relative; }
.b-side { text-align: center; }
.b-sprite { font-size: clamp(3em, 10vw, 6em); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); transition: transform 0.3s, filter 0.3s; }
.b-sprite.hit { animation: hs 0.3s ease-out; }
@keyframes hs { 0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)} }
.b-sprite.atk { animation: al 0.4s ease-out; }
@keyframes al { 0%{transform:translateX(0)}30%{transform:translateX(30px)}100%{transform:translateX(0)} }
.b-sprite.atk-left { animation: alL 0.4s ease-out; }
@keyframes alL { 0%{transform:translateX(0)}30%{transform:translateX(-30px)}100%{transform:translateX(0)} }
.b-info { background: linear-gradient(135deg, rgba(10,10,20,0.8), rgba(20,20,40,0.7)); backdrop-filter: blur(4px); padding: 8px 14px; border-radius: 10px; min-width: 160px; border: 1px solid #2a3a5a; margin-bottom: 6px; }
.b-name { font-weight: 700; font-size: 1em; }
.b-lvl { font-size: 0.75em; color: #8899aa; }
.b-type-badge { font-size: 0.6em; padding: 1px 6px; border-radius: 4px; display: inline-block; margin-left: 4px; vertical-align: middle; }
.hp-bg { width: 100%; height: 8px; background: #1a1a2a; border-radius: 4px; margin-top: 4px; overflow: hidden; }
.hp-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease-out; }
.hp-green { background: linear-gradient(90deg, #30a030, #40c040); }
.hp-yellow { background: linear-gradient(90deg, #b0a020, #d0c030); }
.hp-red { background: linear-gradient(90deg, #c03030, #e04040); }
.hp-txt { font-size: 0.7em; color: #889; margin-top: 2px; }
.xp-bg { width: 100%; height: 4px; background: #1a1a2a; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #3060c0, #5080e0); border-radius: 2px; transition: width 0.5s; }
.b-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; z-index: 1; position: relative; }
.b-actions .btn { min-width: 110px; font-size: 0.95em; padding: 10px 16px; }
#b-log { background: linear-gradient(135deg, rgba(5,5,15,0.85), rgba(10,10,25,0.75)); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 10px; margin-top: 10px; min-height: 50px; max-height: 100px; overflow-y: auto; font-size: 0.9em; line-height: 1.6; width: 100%; max-width: 700px; border: 1px solid #1a2a3a; z-index: 1; position: relative; }

.dmg-popup { position: absolute; font-weight: 900; font-size: 1.8em; z-index: 50; pointer-events: none; animation: df 1s ease-out forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
@keyframes df { 0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(0.5)} }
.eff-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; animation: ff 0.4s ease-out; }
@keyframes ff { 0%{opacity:0.3}100%{opacity:0} }
.catch-anim { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; text-align: center; }
.catch-ball { font-size: 4em; animation: bs 0.6s ease-in-out; }
@keyframes bs { 0%{transform:rotate(0) scale(1)}15%{transform:rotate(-20deg) scale(1.1)}30%{transform:rotate(20deg)}45%{transform:rotate(-15deg)}60%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0) scale(1)} }
.catch-result { font-size: 1.3em; font-weight: 700; margin-top: 10px; animation: pu 0.4s ease-out 0.8s both; }
@keyframes pu { 0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)} }

.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,15,0.92); z-index: 80; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto; }
.overlay.on { display: flex; }
.ov-title { font-size: 1.5em; margin: 10px 0 15px; color: #ffcc00; font-weight: 700; letter-spacing: 1px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; max-width: 650px; max-height: calc(100vh - 160px); overflow-y: auto; padding: 5px; }
.pk-card { background: linear-gradient(160deg, #0e1520, #0a1018); border: 2px solid #1a2a3a; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
.pk-card:hover { border-color: #3a5a8a; transform: translateY(-2px); }
.pk-card.active { border-color: #40a040; box-shadow: 0 0 12px rgba(64,160,64,0.2); }
.pk-card.ko { opacity: 0.45; }
.pk-card.ko::after { content: 'K.O.'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5em; font-weight: 900; color: #cc3333; }
.pk-card .c-spr { font-size: 2.2em; }
.pk-card .c-nm { font-size: 0.8em; font-weight: 600; margin-top: 3px; }
.pk-card .c-lv { font-size: 0.7em; color: #667; }
.pk-card .c-hp { font-size: 0.7em; margin-top: 2px; }
.pk-card .c-hp.green { color: #4a4; } .pk-card .c-hp.red { color: #a33; }
.pk-card .c-stats { font-size: 0.6em; color: #445; margin-top: 2px; }
.pk-card .c-type { display: inline-block; font-size: 0.55em; padding: 1px 6px; border-radius: 4px; margin-top: 3px; }

.pk-detail { background: linear-gradient(160deg, #0e1520, #0a1018); border: 2px solid #2a3a5a; border-radius: 14px; padding: 20px; max-width: 350px; width: 100%; text-align: center; margin-top: 10px; }
.pk-detail .d-spr { font-size: 4em; }
.pk-detail .d-nm { font-size: 1.3em; font-weight: 700; margin: 5px 0; }
.pk-detail .d-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; font-size: 0.85em; }
.pk-detail .d-stat { background: #0a0f18; padding: 6px; border-radius: 6px; }
.pk-detail .d-stat .label { color: #556; font-size: 0.8em; }
.pk-detail .d-stat .val { font-weight: 700; font-size: 1.1em; }
.pk-detail .d-move { display: inline-block; padding: 4px 12px; margin: 3px; border-radius: 6px; font-size: 0.8em; border: 1px solid #2a3a5a; background: #0a1018; }

#mob-ctrl { display: none; position: fixed; bottom: 8px; z-index: 50; width: 100%; pointer-events: none; }
#mob-ctrl.vis { display: flex; justify-content: space-between; padding: 0 15px; align-items: flex-end; }
.dpad { display: grid; grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px; gap: 3px; pointer-events: auto; }
.dpad-b { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: rgba(255,255,255,0.5); font-size: 1.1em; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.dpad-b:active { background: rgba(255,255,255,0.2); }
.dpad-e { background: none; border: none; }
.mob-btns { display: flex; gap: 8px; pointer-events: auto; margin-bottom: 20px; }
.mob-ab { width: 48px; height: 48px; border-radius: 50%; font-size: 0.7em; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); touch-action: manipulation; }
.mob-ab.a-btn { background: rgba(100,200,100,0.15); color: #6c6; }
.mob-ab.b-btn { background: rgba(200,100,100,0.15); color: #c66; }
@media (pointer: coarse) { #mob-ctrl { display: flex; } #mob-ctrl.vis { display: flex; } }
@media (pointer: fine) { #mob-ctrl { display: none !important; } }

.lvl-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #ffcc00, #f09000); color: #1a1a2e; padding: 16px 40px; border-radius: 14px; font-size: 1.3em; font-weight: 700; z-index: 200; animation: lp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; text-align: center; box-shadow: 0 0 40px rgba(255,204,0,0.4); }
.lvl-popup .lvl-sub { font-size: 0.6em; font-weight: 400; color: #4a3a00; margin-top: 4px; }
@keyframes lp { 0%{transform:translate(-50%,-50%) scale(0);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1} }
.caught-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #2060c0, #1050a0); color: #fff; padding: 20px 40px; border-radius: 14px; font-size: 1.2em; font-weight: 700; z-index: 200; animation: lp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; text-align: center; box-shadow: 0 0 40px rgba(32,96,192,0.4); }

#transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#transition.on { opacity: 1; }
.enc-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 200; pointer-events: none; animation: ef 0.6s ease-out forwards; }
@keyframes ef { 0%{opacity:0}10%{opacity:0.8}20%{opacity:0}30%{opacity:0.6}40%{opacity:0}50%{opacity:0.4}100%{opacity:0} }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 2px; }
</style>
</head>
<body>
<div id="game">
  <div id="transition"></div>
  <div id="scr-title" class="scr on">
    <div class="title-particles" id="particles"></div>
    <div class="title-logo"><h1>POKEMON</h1><div class="sub">MINI GAME</div></div>
    <div class="title-btns" id="title-btns"><button class="btn btn-gold" onclick="G.toCharSelect()">Neues Spiel</button></div>
    <div class="title-stats" id="title-stats"></div>
  </div>
  <div id="scr-char" class="scr">
    <div class="sel-title">Wahle deinen Trainer</div>
    <div class="sel-sub">Dein Abenteuer wartet</div>
    <div class="sel-grid" id="char-grid"></div>
    <button class="btn btn-gold" id="char-btn" disabled onclick="G.toStarterSelect()">Weiter</button>
  </div>
  <div id="scr-starter" class="scr">
    <div class="sel-title">Wahle dein Starter-Pokemon</div>
    <div class="sel-sub">Dein erster Partner im Kampf</div>
    <div class="sel-grid" id="starter-grid"></div>
    <div class="pk-detail" id="starter-detail" style="display:none"></div>
    <button class="btn btn-gold" id="start-btn" disabled onclick="G.startNewGame()">Abenteuer beginnen!</button>
  </div>
  <div id="scr-world" class="scr">
    <div id="hud">
      <div class="hud-l"><span id="h-trainer"></span><div class="hud-pokemon"><span id="h-poke"></span><div class="hud-hp-bar"><div class="hud-hp-fill" id="h-hp-fill"></div></div><span id="h-hp-text" style="font-size:0.75em;color:#889;margin-left:4px;"></span></div></div>
      <div class="hud-r"><span class="potion-ct" id="h-potions"></span><span id="h-battles" style="color:#556;font-size:0.8em;"></span><button class="hud-btn" onclick="G.openTeam()">Team</button><button class="hud-btn" onclick="G.openPotions()">Heilen</button></div>
    </div>
    <canvas id="world-canvas"></canvas>
  </div>
  <div id="scr-battle" class="scr">
    <div class="battle-bg-clouds"></div>
    <div class="b-area">
      <div class="b-field">
        <div class="b-side" id="b-player-side"><div class="b-info" id="b-p-info"></div><div class="b-sprite" id="b-p-spr"></div></div>
        <div class="b-side" id="b-enemy-side"><div class="b-info" id="b-e-info"></div><div class="b-sprite" id="b-e-spr"></div></div>
      </div>
      <div class="b-actions" id="b-acts"></div>
    </div>
    <div id="b-log"></div>
  </div>
  <div class="overlay" id="ov-team"><div class="ov-title">Dein Team</div><div class="ov-grid" id="team-grid"></div><div id="team-detail"></div><div style="margin-top:15px;"><button class="btn btn-blue" onclick="G.closeTeam()">Schliessen</button></div></div>
  <div class="overlay" id="ov-potions"><div class="ov-title">Heiltranke</div><p id="pot-info" style="color:#889;margin-bottom:12px;font-size:0.9em;"></p><div class="ov-grid" id="pot-grid"></div><div style="margin-top:15px;"><button class="btn btn-blue" onclick="G.closePotions()">Schliessen</button></div></div>
  <div class="overlay" id="ov-switch"><div class="ov-title">Pokemon wechseln</div><div class="ov-grid" id="switch-grid"></div><div style="margin-top:15px;"><button class="btn btn-blue" onclick="G.closeSwitch()">Abbrechen</button></div></div>
  <div id="mob-ctrl">
    <div class="dpad">
      <div class="dpad-e"></div><button class="dpad-b" ontouchstart="G.move(0,-1);event.preventDefault()" onmousedown="G.move(0,-1)">&#9650;</button><div class="dpad-e"></div>
      <button class="dpad-b" ontouchstart="G.move(-1,0);event.preventDefault()" onmousedown="G.move(-1,0)">&#9664;</button><div class="dpad-e"></div><button class="dpad-b" ontouchstart="G.move(1,0);event.preventDefault()" onmousedown="G.move(1,0)">&#9654;</button>
      <div class="dpad-e"></div><button class="dpad-b" ontouchstart="G.move(0,1);event.preventDefault()" onmousedown="G.move(0,1)">&#9660;</button><div class="dpad-e"></div>
    </div>
    <div class="mob-btns"><button class="mob-ab a-btn" onclick="G.openTeam()">Team</button><button class="mob-ab b-btn" onclick="G.openPotions()">Heal</button></div>
  </div>
  <canvas id="minimap" width="140" height="140"></canvas>
</div>

<script>
"use strict";

// ===================== PERLIN NOISE =====================
const Noise = {
  p: [], perm: [],
  init(seed) {
    const rng = this.seeded(seed);
    this.p = [];
    for (let i = 0; i < 256; i++) this.p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [this.p[i], this.p[j]] = [this.p[j], this.p[i]]; }
    this.perm = [];
    for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
  },
  seeded(s) { return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; }; },
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
  lerp(a, b, t) { return a + t * (b - a); },
  grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  },
  get(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this.fade(xf), v = this.fade(yf);
    const aa = this.perm[this.perm[X] + Y], ab = this.perm[this.perm[X] + Y + 1];
    const ba = this.perm[this.perm[X + 1] + Y], bb = this.perm[this.perm[X + 1] + Y + 1];
    return this.lerp(this.lerp(this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf), u), this.lerp(this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1), u), v);
  },
  octave(x, y, oct, lac, gain) {
    let val = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < oct; i++) { val += this.get(x * freq, y * freq) * amp; max += amp; amp *= gain; freq *= lac; }
    return val / max;
  }
};

// ===================== PIXEL ART RENDERER =====================
const Sprites = {
  cache: {},
  oc: null,
  init() { this.oc = document.createElement('canvas'); },

  drawPixels(ctx, x, y, size, pixels, palette) {
    const ps = size / pixels[0].length;
    for (let py = 0; py < pixels.length; py++) {
      for (let px = 0; px < pixels[py].length; px++) {
        const ci = pixels[py][px];
        if (ci === 0) continue;
        ctx.fillStyle = palette[ci];
        ctx.fillRect(x + px * ps, y + py * ps, Math.ceil(ps), Math.ceil(ps));
      }
    }
  },

  // Pre-render a tile to offscreen canvas
  getTile(name, size, drawFn) {
    const key = name + '_' + size;
    if (this.cache[key]) return this.cache[key];
    const c = document.createElement('canvas');
    c.width = c.height = size;
    drawFn(c.getContext('2d'), size);
    this.cache[key] = c;
    return c;
  },

  // Grass tile with texture
  grassTile(ctx, s, shade) {
    const base = shade || 0;
    const g1 = [96+base, 160+base, 72+base];
    const g2 = [80+base, 140+base, 60+base];
    const g3 = [110+base, 175+base, 85+base];
    ctx.fillStyle = `rgb(${g1[0]},${g1[1]},${g1[2]})`;
    ctx.fillRect(0, 0, s, s);
    // texture dots
    for (let i = 0; i < 8; i++) {
      const x = (i * 37 + 5) % s, y = (i * 23 + 7) % s;
      ctx.fillStyle = `rgb(${g2[0]},${g2[1]},${g2[2]})`;
      ctx.fillRect(x, y, 2, 2);
    }
    for (let i = 0; i < 4; i++) {
      const x = (i * 29 + 13) % s, y = (i * 41 + 3) % s;
      ctx.fillStyle = `rgb(${g3[0]},${g3[1]},${g3[2]})`;
      ctx.fillRect(x, y, 1, 2);
    }
  },

  tallGrassTile(ctx, s, frame) {
    this.grassTile(ctx, s, -15);
    const cols = ['#2a6e22', '#328a2c', '#247020', '#2c7a26'];
    const sway = Math.sin(frame * 0.05) * 2;
    for (let i = 0; i < 6; i++) {
      const bx = (i * 11 + 3) % (s - 4);
      const by = s - 4 - (i * 7 % 12);
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(bx + sway * (i % 2 ? 1 : -1), by, 2, -(6 + i % 4));
      ctx.fillRect(bx + 2 + sway * (i % 2 ? -1 : 1), by - 2, 2, -(5 + i % 3));
    }
  },

  waterTile(ctx, s, frame) {
    const t = frame * 0.03;
    for (let y = 0; y < s; y++) {
      for (let x = 0; x < s; x++) {
        const wave = Math.sin(x * 0.3 + t * 3) * 8 + Math.sin(y * 0.2 + t * 2) * 6;
        const r = 30 + wave;
        const g = 80 + wave * 1.2;
        const b = 170 + wave * 0.8;
        ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r|0))},${Math.max(0,Math.min(255,g|0))},${Math.max(0,Math.min(255,b|0))})`;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    // highlights
    const hx = ((frame * 0.5) % s);
    ctx.fillStyle = 'rgba(200,220,255,0.25)';
    ctx.fillRect(hx, s * 0.3, 6, 2);
    ctx.fillRect((hx + s/2) % s, s * 0.7, 4, 1);
  },

  treeTile(ctx, s) {
    // trunk
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(s*0.35, s*0.55, s*0.3, s*0.45);
    ctx.fillStyle = '#4a2a10';
    ctx.fillRect(s*0.38, s*0.6, s*0.08, s*0.35);
    // canopy layers
    const greens = ['#1a5a14', '#228822', '#2a7a22', '#1e6e1a'];
    const shapes = [
      [s*0.1, s*0.3, s*0.8, s*0.35],
      [s*0.15, s*0.15, s*0.7, s*0.3],
      [s*0.25, s*0.02, s*0.5, s*0.25],
    ];
    shapes.forEach((sh, i) => {
      ctx.fillStyle = greens[i];
      ctx.beginPath();
      ctx.ellipse(sh[0] + sh[2]/2, sh[1] + sh[3]/2, sh[2]/2, sh[3]/2, 0, 0, Math.PI*2);
      ctx.fill();
    });
    // highlight
    ctx.fillStyle = 'rgba(100,200,80,0.3)';
    ctx.beginPath();
    ctx.ellipse(s*0.4, s*0.2, s*0.12, s*0.1, 0, 0, Math.PI*2);
    ctx.fill();
  },

  rockTile(ctx, s) {
    // base grass
    ctx.fillStyle = '#508040';
    ctx.fillRect(0, 0, s, s);
    // rock body
    const grd = ctx.createLinearGradient(s*0.2, s*0.15, s*0.8, s*0.85);
    grd.addColorStop(0, '#8a8a8a');
    grd.addColorStop(0.5, '#6a6a6a');
    grd.addColorStop(1, '#4a4a4a');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(s*0.15, s*0.85);
    ctx.lineTo(s*0.1, s*0.5);
    ctx.lineTo(s*0.3, s*0.15);
    ctx.lineTo(s*0.7, s*0.12);
    ctx.lineTo(s*0.9, s*0.45);
    ctx.lineTo(s*0.85, s*0.85);
    ctx.closePath();
    ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(180,180,180,0.3)';
    ctx.beginPath();
    ctx.moveTo(s*0.3, s*0.2);
    ctx.lineTo(s*0.5, s*0.15);
    ctx.lineTo(s*0.4, s*0.4);
    ctx.closePath();
    ctx.fill();
    // cracks
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s*0.4, s*0.3);
    ctx.lineTo(s*0.5, s*0.55);
    ctx.lineTo(s*0.6, s*0.5);
    ctx.stroke();
  },

  pathTile(ctx, s) {
    ctx.fillStyle = '#c8b070';
    ctx.fillRect(0, 0, s, s);
    // pebbles and texture
    const cols = ['#b8a060', '#d0c080', '#a89050', '#c0a868'];
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = cols[i % cols.length];
      const x = (i * 31 + 7) % (s - 3);
      const y = (i * 23 + 11) % (s - 3);
      ctx.fillRect(x, y, 2 + i%2, 1 + i%2);
    }
    // edge darkening
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, s, 2);
    ctx.fillRect(0, 0, 2, s);
  },

  sandTile(ctx, s) {
    ctx.fillStyle = '#d8c878';
    ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 ? '#c8b868' : '#e0d088';
      const x = (i * 29 + 5) % (s - 2);
      const y = (i * 19 + 3) % (s - 2);
      ctx.fillRect(x, y, 2, 1);
    }
  },

  flowerTile(ctx, s, mx, my) {
    this.grassTile(ctx, s, 5);
    const colors = [
      ['#e04040','#ff6060'], ['#e0e040','#ffff70'], ['#e040e0','#ff70ff'],
      ['#4040e0','#7070ff'], ['#e08040','#ffa060']
    ];
    const fc = colors[(mx * 7 + my * 13) % colors.length];
    const cx = s/2, cy = s/2;
    // petals
    ctx.fillStyle = fc[0];
    for (let a = 0; a < 5; a++) {
      const angle = a * Math.PI * 2 / 5;
      const px = cx + Math.cos(angle) * s * 0.15;
      const py = cy + Math.sin(angle) * s * 0.15;
      ctx.beginPath();
      ctx.arc(px, py, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
    // center
    ctx.fillStyle = fc[1];
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.08, 0, Math.PI * 2);
    ctx.fill();
  },

  bridgeTile(ctx, s) {
    // water underneath
    ctx.fillStyle = '#2060a0';
    ctx.fillRect(0, 0, s, s);
    // planks
    ctx.fillStyle = '#8a6830';
    ctx.fillRect(s*0.1, 0, s*0.8, s);
    // plank lines
    ctx.strokeStyle = '#6a4820';
    ctx.lineWidth = 1;
    for (let y = 0; y < s; y += s/4) {
      ctx.beginPath();
      ctx.moveTo(s*0.1, y);
      ctx.lineTo(s*0.9, y);
      ctx.stroke();
    }
    // rails
    ctx.fillStyle = '#5a3818';
    ctx.fillRect(s*0.08, 0, s*0.06, s);
    ctx.fillRect(s*0.86, 0, s*0.06, s);
    // nail highlights
    ctx.fillStyle = '#a0a0a0';
    for (let y = s*0.12; y < s; y += s/4) {
      ctx.fillRect(s*0.1, y, 2, 2);
      ctx.fillRect(s*0.86, y, 2, 2);
    }
  },

  // Draw pixel-art character
  drawCharacter(ctx, x, y, size, dir, frame, color) {
    const s = size;
    const p = s / 16;
    // color schemes
    const hair = color || '#3a2a1a';
    const skin = '#f0c8a0';
    const shirt = '#e04040';
    const pants = '#3050a0';
    const shoe = '#2a2a2a';
    const outline = '#1a1a1a';
    const walk = Math.sin(frame * 0.15) * p;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x + s/2, y + s - p, s*0.35, p*1.5, 0, 0, Math.PI*2);
    ctx.fill();

    // Feet
    ctx.fillStyle = shoe;
    ctx.fillRect(x + 4*p, y + 14*p + walk, 3*p, 2*p);
    ctx.fillRect(x + 9*p, y + 14*p - walk, 3*p, 2*p);

    // Legs
    ctx.fillStyle = pants;
    ctx.fillRect(x + 4*p, y + 11*p + walk*0.5, 3*p, 3*p);
    ctx.fillRect(x + 9*p, y + 11*p - walk*0.5, 3*p, 3*p);

    // Body
    ctx.fillStyle = shirt;
    ctx.fillRect(x + 3*p, y + 6*p, 10*p, 5*p);
    // shirt detail
    ctx.fillStyle = '#c03030';
    ctx.fillRect(x + 7*p, y + 7*p, 1*p, 3*p);

    // Arms
    ctx.fillStyle = skin;
    ctx.fillRect(x + 1*p, y + 7*p + walk*0.3, 2*p, 4*p);
    ctx.fillRect(x + 13*p, y + 7*p - walk*0.3, 2*p, 4*p);

    // Head
    ctx.fillStyle = skin;
    ctx.fillRect(x + 4*p, y + 1*p, 8*p, 5*p);

    // Hair
    ctx.fillStyle = hair;
    ctx.fillRect(x + 3*p, y + 0*p, 10*p, 2*p);
    ctx.fillRect(x + 3*p, y + 2*p, 2*p, 2*p);
    ctx.fillRect(x + 11*p, y + 2*p, 2*p, 2*p);

    // Cap
    ctx.fillStyle = '#cc2020';
    ctx.fillRect(x + 3*p, y + 0*p, 10*p, 2*p);
    ctx.fillStyle = '#ee4040';
    ctx.fillRect(x + 2*p, y + 1*p, 12*p, 1*p);
    // cap brim
    ctx.fillStyle = '#aa1010';
    ctx.fillRect(x + 1*p, y + 2*p, 3*p, 1*p);

    // Eyes
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x + 6*p, y + 3*p, 1*p, 1*p);
    ctx.fillRect(x + 9*p, y + 3*p, 1*p, 1*p);
    // eye shine
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 6*p, y + 3*p, 1, 1);
    ctx.fillRect(x + 9*p, y + 3*p, 1, 1);

    // Mouth
    ctx.fillStyle = '#c08070';
    ctx.fillRect(x + 7*p, y + 5*p, 2*p, 1*p);
  },

  // Decorative elements drawn on grass
  drawDecor(ctx, x, y, s, type) {
    if (type === 0) {
      // small bush
      ctx.fillStyle = '#3a7030';
      ctx.beginPath(); ctx.arc(x+s*0.3, y+s*0.7, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4a8040';
      ctx.beginPath(); ctx.arc(x+s*0.5, y+s*0.6, s*0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a7030';
      ctx.beginPath(); ctx.arc(x+s*0.7, y+s*0.7, s*0.16, 0, Math.PI*2); ctx.fill();
    } else if (type === 1) {
      // mushroom
      ctx.fillStyle = '#d8c8a0';
      ctx.fillRect(x+s*0.45, y+s*0.6, s*0.1, s*0.2);
      ctx.fillStyle = '#cc3030';
      ctx.beginPath(); ctx.arc(x+s*0.5, y+s*0.55, s*0.15, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x+s*0.45, y+s*0.48, s*0.03, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+s*0.55, y+s*0.45, s*0.025, 0, Math.PI*2); ctx.fill();
    } else if (type === 2) {
      // small stones
      ctx.fillStyle = '#8a8a7a';
      ctx.beginPath(); ctx.arc(x+s*0.3, y+s*0.75, s*0.06, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7a7a6a';
      ctx.beginPath(); ctx.arc(x+s*0.5, y+s*0.8, s*0.05, 0, Math.PI*2); ctx.fill();
    }
  }
};

  // Pokemon
  st(b,l){return Math.floor((2*b*l/100)+l+10);},
  mhp(b,l){return Math.floor((2*b*l/100)+l+10+l);},
  getMoves(t,l){const p=MOVES[t]||MOVES.normal;const m=[p[0]];if(l>=10&&p[1])m.push(p[1]);if(l>=30&&p[2])m.push(p[2]);if(l>=5&&t!=='normal')m.push(MOVES.normal[0]);return m;},
  mkP(d,l){const m=this.mhp(d.hp,l);return{id:d.id,nm:d.nm,spr:d.spr,t:d.t,lv:l,xp:0,xpN:l*30+60,mhp:m,hp:m,atk:this.st(d.atk,l),def:this.st(d.def,l),spd:this.st(d.spd,l),bHp:d.hp,bAtk:d.atk,bDef:d.def,bSpd:d.spd,tier:d.tier,moves:this.getMoves(d.t,l),evoId:d.evo?d.evo.to:null,evoLv:d.evo?d.evo.lv:null};},
  rcP(p){const d=DB.find(x=>x.id===p.id);if(!d)return;p.mhp=this.mhp(d.hp,p.lv);p.atk=this.st(d.atk,p.lv);p.def=this.st(d.def,p.lv);p.spd=this.st(d.spd,p.lv);p.bHp=d.hp;p.bAtk=d.atk;p.bDef=d.def;p.bSpd=d.spd;p.moves=this.getMoves(p.t,p.lv);p.evoId=d.evo?d.evo.to:null;p.evoLv=d.evo?d.evo.lv:null;},
  tryEvo(p){if(!p.evoId||!p.evoLv||p.lv<p.evoLv)return false;const nd=DB.find(x=>x.id===p.evoId);if(!nd)return false;const o=p.nm;p.id=nd.id;p.nm=nd.nm;p.spr=nd.spr;p.t=nd.t;p.tier=nd.tier;this.rcP(p);p.hp=p.mhp;this.popup(`${o} entwickelt sich zu ${p.nm}!`,'caught-popup',2500);Au.lv();return true;},
  lvUp(p){p.lv++;const om=p.mhp;this.rcP(p);const hg=p.mhp-om;p.hp=Math.min(p.mhp,p.hp+hg);p.xp=0;p.xpN=p.lv*30+60;this.popup(`${p.nm} ist jetzt Level ${p.lv}!<div class="lvl-sub">HP+${hg} ATK:${p.atk} DEF:${p.def} SPD:${p.spd}</div>`,'lvl-popup');Au.lv();setTimeout(()=>this.tryEvo(p),2200);},
  popup(h,c,d){const el=document.createElement('div');el.className=c||'lvl-popup';el.innerHTML=h;document.body.appendChild(el);setTimeout(()=>el.remove(),d||2000);},

  // World gen
  genWorld() {
    const W=80,H=80;
    this.s.mw=W;this.s.mh=H;
    const seed = Math.floor(Math.random()*99999);
    Noise.init(seed);
    this.s.seed = seed;
    const m=[];

    for(let y=0;y<H;y++){m[y]=[];for(let x=0;x<W;x++){
      const e=Noise.octave(x*0.04,y*0.04,4,2,0.5);
      const moist=Noise.octave(x*0.06+100,y*0.06+100,3,2,0.5);
      const detail=Noise.octave(x*0.15,y*0.15,2,2,0.5);

      if(e<-0.15) m[y][x]=T.WATER;
      else if(e<-0.05) m[y][x]=T.SAND;
      else if(e<0.25){
        if(moist>0.1) m[y][x]=T.TALL;
        else if(detail>0.3) m[y][x]=T.FLOWER;
        else m[y][x]=T.GRASS;
      } else if(e<0.4){
        if(moist>0.15) m[y][x]=T.TREE;
        else m[y][x]=T.GRASS;
      } else {
        if(detail>0.2) m[y][x]=T.ROCK;
        else m[y][x]=T.TREE;
      }
    }}

    // Paths using random walks
    for(let p=0;p<6;p++){
      let cx,cy;
      if(p<2){cx=0;cy=Math.floor(Math.random()*H);}
      else if(p<4){cx=Math.floor(Math.random()*W);cy=0;}
      else{cx=Math.floor(Math.random()*W);cy=Math.floor(Math.random()*H);}
      const tx=Math.floor(W/2)+Math.floor(Math.random()*20-10);
      const ty=Math.floor(H/2)+Math.floor(Math.random()*20-10);
      for(let i=0;i<200;i++){
        if(cx>=0&&cx<W&&cy>=0&&cy<H){
          m[cy][cx]=T.PATH;
          if(cy>0&&Math.random()<0.3)m[cy-1][cx]=T.PATH;
          if(cx>0&&Math.random()<0.3)m[cy][cx-1]=T.PATH;
        }
        if(Math.abs(cx-tx)+Math.abs(cy-ty)<3)break;
        const dx=tx-cx,dy=ty-cy;
        if(Math.random()<0.7){
          cx+=dx>0?1:dx<0?-1:0;
        } else {
          cy+=dy>0?1:dy<0?-1:0;
        }
        if(Math.random()<0.15){cx+=Math.random()<0.5?1:-1;}
        if(Math.random()<0.15){cy+=Math.random()<0.5?1:-1;}
        cx=Math.max(0,Math.min(W-1,cx));
        cy=Math.max(0,Math.min(H-1,cy));
      }
    }

    // Bridges
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      if(m[y][x]===T.WATER){
        const adj=[m[y-1][x],m[y+1][x],m[y][x-1],m[y][x+1]];
        if(adj.filter(t=>t===T.PATH).length>=2)m[y][x]=T.BRIDGE;
      }
    }

    // Clear spawn
    const sx=Math.floor(W/2),sy=Math.floor(H/2);
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const ny=sy+dy,nx=sx+dx;
      if(ny>=0&&ny<H&&nx>=0&&nx<W)m[ny][nx]=Math.abs(dx)+Math.abs(dy)<3?T.PATH:T.GRASS;
    }
    this.s.map=m;this.s.px=sx;this.s.py=sy;
  },

  // Rendering
  renderWorld() {
    const c=this.canvas;
    c.width=window.innerWidth;
    c.height=window.innerHeight-44;
    const ctx=this.ctx;
    const vw=Math.ceil(c.width/TILE)+2;
    const vh=Math.ceil(c.height/TILE)+2;
    const cx=this.s.px-Math.floor(vw/2);
    const cy=this.s.py-Math.floor(vh/2);
    const f=this.frame;

    ctx.imageSmoothingEnabled = false;

    for(let vy=0;vy<vh;vy++){for(let vx=0;vx<vw;vx++){
      const mx=cx+vx,my=cy+vy;
      const px=vx*TILE,py=vy*TILE;

      if(mx<0||mx>=this.s.mw||my<0||my>=this.s.mh){
        ctx.fillStyle='#1a3a1a';ctx.fillRect(px,py,TILE,TILE);continue;
      }

      const t=this.s.map[my][mx];

      if(t===T.GRASS){
        ctx.drawImage(this.tileCache.grass,px,py);
        // random decorations seeded by position
        const decHash=(mx*2347+my*7919)%100;
        if(decHash<5) Sprites.drawDecor(ctx,px,py,TILE,decHash%3);
      } else if(t===T.TALL){
        // draw animated tall grass
        const tc=document.createElement('canvas');tc.width=tc.height=TILE;
        Sprites.tallGrassTile(tc.getContext('2d'),TILE,f+(mx*5+my*3));
        ctx.drawImage(tc,px,py);
      } else if(t===T.WATER){
        const wc=document.createElement('canvas');wc.width=wc.height=TILE;
        Sprites.waterTile(wc.getContext('2d'),TILE,f+(mx*3+my*7));
        ctx.drawImage(wc,px,py);
      } else if(t===T.TREE){
        ctx.drawImage(this.tileCache.grass,px,py);
        ctx.drawImage(this.tileCache.tree,px,py);
      } else if(t===T.ROCK){
        ctx.drawImage(this.tileCache.rock,px,py);
      } else if(t===T.PATH){
        ctx.drawImage(this.tileCache.path,px,py);
      } else if(t===T.FLOWER){
        const fv=(mx*7+my*13)%5;
        ctx.drawImage(this.tileCache['flower'+fv],px,py);
      } else if(t===T.SAND){
        ctx.drawImage(this.tileCache.sand,px,py);
      } else if(t===T.BRIDGE){
        ctx.drawImage(this.tileCache.bridge,px,py);
      }

      // Edge blending: darken edges near different terrain
      if(mx>0&&mx<this.s.mw-1&&my>0&&my<this.s.mh-1){
        const neighbors=[this.s.map[my-1][mx],this.s.map[my+1][mx],this.s.map[my][mx-1],this.s.map[my][mx+1]];
        const hasDiff=neighbors.some(n=>n!==t);
        if(hasDiff&&t!==T.WATER&&t!==T.TREE){
          ctx.fillStyle='rgba(0,0,0,0.04)';
          ctx.fillRect(px,py,TILE,TILE);
        }
      }
    }}

    // Draw character
    const ppx=(this.s.px-cx)*TILE;
    const ppy=(this.s.py-cy)*TILE;
    Sprites.drawCharacter(ctx, ppx, ppy, TILE, 0, f, this.s.char.hair);

    this.renderMM();
  },

  renderMM() {
    const mc=this.mmX;
    const sc=140/this.s.mw;
    mc.clearRect(0,0,140,140);
    const mmCols={[T.GRASS]:'#5a9a4a',[T.TALL]:'#3a7a2a',[T.WATER]:'#2868b0',[T.TREE]:'#2a5a20',[T.ROCK]:'#5a5a5a',[T.PATH]:'#c0a860',[T.FLOWER]:'#6aaa5a',[T.SAND]:'#d0b870',[T.BRIDGE]:'#8a6a3a'};
    for(let y=0;y<this.s.mh;y++)for(let x=0;x<this.s.mw;x++){
      mc.fillStyle=mmCols[this.s.map[y][x]]||'#333';
      mc.fillRect(x*sc,y*sc,Math.ceil(sc),Math.ceil(sc));
    }
    // player dot with glow
    mc.fillStyle='rgba(255,255,0,0.3)';
    mc.beginPath();mc.arc(this.s.px*sc,this.s.py*sc,4,0,Math.PI*2);mc.fill();
    mc.fillStyle='#ff0';
    mc.fillRect(this.s.px*sc-1,this.s.py*sc-1,3,3);
  },

  updateHud() {
    this.refreshPot();
    const a=this.s.team[this.s.active];
    document.getElementById('h-trainer').textContent=`${this.s.char.spr} ${this.s.char.nm}`;
    document.getElementById('h-poke').textContent=a?`${a.spr} ${a.nm} Lv.${a.lv}`:'';
    const fl=document.getElementById('h-hp-fill');
    if(a){const p=Math.max(0,a.hp/a.mhp*100);fl.style.width=p+'%';fl.style.background=p>50?'#40a040':p>25?'#b0a020':'#c03030';document.getElementById('h-hp-text').textContent=`${a.hp}/${a.mhp}`;}
    document.getElementById('h-potions').textContent=`\u{1F9EA} ${this.s.potions}`;
    document.getElementById('h-battles').textContent=`⚔️ ${this.s.battlesWon}`;
  },
  refreshPot(){const t=new Date().toDateString();if(this.s.lastPD!==t){this.s.potions=5;this.s.lastPD=t;}},

  // Movement
  initKeys() {
    const km={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    const held={};
    document.addEventListener('keydown',e=>{if(this.s&&this.s.inBattle)return;if(km[e.key]){e.preventDefault();if(!held[e.key]){held[e.key]=true;this.move(km[e.key][0],km[e.key][1]);}}if(e.key==='p'||e.key==='P')this.openTeam();if(e.key==='h'||e.key==='H')this.openPotions();if(e.key==='Escape'){this.closeTeam();this.closePotions();this.closeSwitch();}});
    document.addEventListener('keyup',e=>{held[e.key]=false;});
    let ml=null;
    const stl=()=>{if(ml)return;ml=setInterval(()=>{if(this.s&&!this.s.inBattle){for(const k of Object.keys(held)){if(held[k]&&km[k]){this.move(km[k][0],km[k][1]);break;}}}},this.moveDelay);};
    const spl=()=>{clearInterval(ml);ml=null;};
    document.addEventListener('keydown',stl);
    document.addEventListener('keyup',e=>{if(!Object.values(held).some(v=>v))spl();});
  },

  move(dx,dy) {
    if(!this.s||this.s.inBattle)return;
    const now=Date.now();if(now-this.lastMove<this.moveDelay)return;this.lastMove=now;
    const nx=this.s.px+dx,ny=this.s.py+dy;
    if(nx<0||nx>=this.s.mw||ny<0||ny>=this.s.mh)return;
    if(!TW.has(this.s.map[ny][nx]))return;
    this.s.px=nx;this.s.py=ny;
    Au.st();this.renderWorld();this.updateHud();this.checkEnc();
  },

  checkEnc() {
    if(this.s.map[this.s.py][this.s.px]!==T.TALL)return;
    if(Math.random()>0.08)return;
    if(!this.s.team.some(p=>p.hp>0))return;
    if(this.s.team[this.s.active].hp<=0){const i=this.s.team.findIndex(p=>p.hp>0);if(i>=0)this.s.active=i;}
    this.startBattle();
  },

  wildLv(){const a=this.s.team[this.s.active];return Math.max(1,Math.max(1,a.lv-3)+Math.floor(Math.random()*(6+Math.floor(this.s.battlesWon/4))));},
  wildTier(){const w=this.s.battlesWon,r=Math.random();if(w<5)return 1;if(w<12)return r<.65?1:2;if(w<25)return r<.2?1:r<.75?2:3;if(w<45)return r<.05?1:r<.35?2:r<.8?3:4;return r<.3?3:4;},
  spawnW(){const t=this.wildTier();const pool=DB.filter(d=>d.tier===t);return this.mkP(pool[Math.floor(Math.random()*pool.length)],this.wildLv());},

  // Battle
  startBattle(){Au.enc();this.s.inBattle=true;this.battleBusy=false;this.s.enemy=this.spawnW();
    const fl=document.createElement('div');fl.className='enc-flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),700);
    setTimeout(()=>{this.showScreen('scr-battle');setTimeout(()=>{this.renderB();this.bl(`Ein wildes ${this.s.enemy.nm} (Lv.${this.s.enemy.lv}) erscheint!`);this.rBA();},350);},400);},

  renderB(){const p=this.s.team[this.s.active],e=this.s.enemy;
    document.getElementById('b-p-spr').textContent=p.spr;document.getElementById('b-e-spr').textContent=e.spr;
    const pp=Math.max(0,p.hp/p.mhp*100),ep=Math.max(0,e.hp/e.mhp*100);
    const hc=v=>v>50?'hp-green':v>25?'hp-yellow':'hp-red';
    const xp=p.xpN>0?Math.min(100,p.xp/p.xpN*100):0;
    document.getElementById('b-p-info').innerHTML=`<div class="b-name">${p.nm} <span class="b-type-badge t-${p.t}">${p.t}</span></div><div class="b-lvl">Lv. ${p.lv}</div><div class="hp-bg"><div class="hp-fill ${hc(pp)}" style="width:${pp}%"></div></div><div class="hp-txt">${p.hp}/${p.mhp}</div><div class="xp-bg"><div class="xp-fill" style="width:${xp}%"></div></div>`;
    document.getElementById('b-e-info').innerHTML=`<div class="b-name">${e.nm} <span class="b-type-badge t-${e.t}">${e.t}</span></div><div class="b-lvl">Lv. ${e.lv}</div><div class="hp-bg"><div class="hp-fill ${hc(ep)}" style="width:${ep}%"></div></div><div class="hp-txt">${e.hp}/${e.mhp}</div>`;
  },

  rBA(){const a=document.getElementById('b-acts');
    if(this.s.battleOver){a.innerHTML=`<button class="btn btn-gold" onclick="G.endB()">Weiter</button>`;return;}
    const p=this.s.team[this.s.active];let h='';
    p.moves.forEach((m,i)=>{h+=`<button class="btn btn-blue" onclick="G.bAtk(${i})" title="${m.pow} Starke">${m.name}<span style="font-size:0.7em;display:block;color:#889;">${m.pow}</span></button>`;});
    h+=`<button class="btn btn-green" onclick="G.bCat()">Fangen</button><button class="btn btn-blue" onclick="G.bSw()">Wechseln</button><button class="btn btn-red" onclick="G.bRun()">Fliehen</button>`;
    a.innerHTML=h;},

  bl(m){const l=document.getElementById('b-log');l.innerHTML+=m+'<br>';l.scrollTop=l.scrollHeight;},
  tM(a,d){return(TE[a]&&TE[a][d]!==undefined)?TE[a][d]:1;},
  cD(atk,def,move,at,dt,lv){const m=this.tM(at,dt);const cr=Math.random()<0.0625?1.5:1;const rn=0.85+Math.random()*0.15;const b=Math.floor(((2*lv/5+2)*atk*move.pow/def)/50+2);return{dmg:Math.max(1,Math.floor(b*m*cr*rn)),mult:m,crit:cr>1};},

  sDmg(side,dmg,cr,hl){const el=document.createElement('div');el.className='dmg-popup';el.textContent=(hl?'+':'-')+dmg;el.style.color=hl?'#44dd44':(cr?'#ff4444':'#ffffff');if(cr)el.style.fontSize='2.2em';const tg=document.getElementById(side==='player'?'b-p-spr':'b-e-spr');const r=tg.getBoundingClientRect();el.style.left=r.left+r.width/2-20+'px';el.style.top=r.top-10+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000);},

  aS(side,cls){const el=document.getElementById(side==='player'?'b-p-spr':'b-e-spr');el.classList.remove('hit','atk','atk-left');void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),500);},

  async bAtk(mi){if(this.s.battleOver||this.battleBusy)return;this.battleBusy=true;
    const p=this.s.team[this.s.active],e=this.s.enemy,pm=p.moves[mi];
    const pF=p.spd>=e.spd;
    const em=e.moves[Math.floor(Math.random()*e.moves.length)];
    const doT=async(a,d,mv,as,ds)=>{if(a.hp<=0)return false;
      if(Math.random()*100>mv.acc){this.bl(`${a.nm}: ${mv.name}... Daneben!`);Au.fail();await this.w(500);return true;}
      const r=this.cD(a.atk,d.def,mv,a.t,d.t,a.lv);this.aS(as,as==='player'?'atk':'atk-left');Au.atk();await this.w(200);
      d.hp=Math.max(0,d.hp-r.dmg);this.aS(ds,'hit');Au.hit();this.sDmg(ds,r.dmg,r.crit);
      let msg=`${a.nm}: ${mv.name}! ${r.dmg} Schaden.`;if(r.crit)msg+=' Volltreffer!';if(r.mult>=2)msg+=' Sehr effektiv!';else if(r.mult>0&&r.mult<1)msg+=' Nicht effektiv...';else if(r.mult===0)msg+=' Kein Effekt!';
      this.bl(msg);this.renderB();await this.w(500);return d.hp>0;};
    if(pF){const el=await doT(p,e,pm,'player','enemy');if(!el){this.bVic();return;}const pl=await doT(e,p,em,'enemy','player');if(!pl){this.hFaint();return;}}
    else{const pl=await doT(e,p,em,'enemy','player');if(!pl){this.hFaint();return;}const el=await doT(p,e,pm,'player','enemy');if(!el){this.bVic();return;}}
    this.battleBusy=false;this.rBA();},

  hFaint(){const p=this.s.team[this.s.active];this.bl(`${p.nm} ist besiegt!`);Au.fail();
    const n=this.s.team.findIndex(pk=>pk.hp>0);if(n>=0){this.s.active=n;this.bl(`${this.s.team[this.s.active].nm} ubernimmt!`);this.renderB();this.battleBusy=false;this.rBA();}
    else{this.bl('Alle Pokemon besiegt!');this.s.battleOver=true;this.battleBusy=false;this.rBA();}},

  bVic(){this.s.battleOver=true;this.s.battlesWon++;const e=this.s.enemy,p=this.s.team[this.s.active];
    const xp=Math.floor(e.lv*18+e.tier*15);p.xp+=xp;this.bl(`${e.nm} besiegt! +${xp} XP`);
    while(p.xp>=p.xpN){p.xp-=p.xpN;this.lvUp(p);this.bl(`${p.nm} erreicht Level ${p.lv}!`);}
    this.renderB();this.battleBusy=false;this.rBA();},

  async bCat(){if(this.s.battleOver||this.battleBusy)return;this.battleBusy=true;
    const e=this.s.enemy;let rate=(1-e.hp/e.mhp)*0.55+0.08;if(e.tier>=3)rate*=0.45;if(e.tier>=4)rate*=0.25;
    this.bl('Pokeball!');const an=document.createElement('div');an.className='catch-anim';an.innerHTML='<div class="catch-ball">⚪</div>';document.body.appendChild(an);await this.w(800);
    if(Math.random()<rate){Au.cat();an.innerHTML+='<div class="catch-result" style="color:#44dd44;">Gefangen!</div>';this.s.team.push({...e});this.s.battleOver=true;this.s.battlesWon++;const xp=Math.floor(e.lv*12);const p=this.s.team[this.s.active];p.xp+=xp;while(p.xp>=p.xpN){p.xp-=p.xpN;this.lvUp(p);}this.bl(`${e.nm} gefangen! +${xp} XP`);}
    else{Au.fail();an.innerHTML+='<div class="catch-result" style="color:#dd4444;">Entkommen!</div>';this.bl('Entkommen!');}
    await this.w(1200);an.remove();
    if(!this.s.battleOver){const p=this.s.team[this.s.active];const em=e.moves[Math.floor(Math.random()*e.moves.length)];const r=this.cD(e.atk,p.def,em,e.t,p.t,e.lv);p.hp=Math.max(0,p.hp-r.dmg);this.aS('player','hit');Au.hit();this.sDmg('player',r.dmg,r.crit);this.bl(`${e.nm}: ${em.name}! ${r.dmg}`);this.renderB();if(p.hp<=0){this.hFaint();return;}}
    this.renderB();this.battleBusy=false;this.rBA();},

  bSw(){if(this.s.battleOver||this.battleBusy)return;
    if(!this.s.team.some((p,i)=>p.hp>0&&i!==this.s.active)){this.bl('Kein anderes Pokemon!');return;}
    const ov=document.getElementById('ov-switch');ov.classList.add('on');const g=document.getElementById('switch-grid');g.innerHTML='';
    this.s.team.forEach((p,i)=>{if(i===this.s.active||p.hp<=0)return;const c=this.mkCard(p,i,false);c.onclick=async()=>{Au.cl();this.s.active=i;ov.classList.remove('on');this.bl(`${p.nm} eingewechselt!`);this.renderB();await this.w(300);const e=this.s.enemy,pl=this.s.team[this.s.active];const em=e.moves[Math.floor(Math.random()*e.moves.length)];const r=this.cD(e.atk,pl.def,em,e.t,pl.t,e.lv);pl.hp=Math.max(0,pl.hp-r.dmg);this.aS('player','hit');Au.hit();this.sDmg('player',r.dmg,r.crit);this.bl(`${e.nm}: ${em.name}! ${r.dmg}`);this.renderB();if(pl.hp<=0)this.hFaint();this.rBA();};g.appendChild(c);});},
  closeSwitch(){document.getElementById('ov-switch').classList.remove('on');},

  async bRun(){if(this.s.battleOver||this.battleBusy)return;this.battleBusy=true;
    const p=this.s.team[this.s.active],ch=Math.max(0.2,Math.min(0.95,0.5+(p.spd-this.s.enemy.spd)*0.01));
    if(Math.random()<ch){Au.fl();this.bl('Geflohen!');this.s.battleOver=true;this.battleBusy=false;this.rBA();}
    else{this.bl('Flucht fehlgeschlagen!');await this.w(300);const e=this.s.enemy;const em=e.moves[Math.floor(Math.random()*e.moves.length)];const r=this.cD(e.atk,p.def,em,e.t,p.t,e.lv);p.hp=Math.max(0,p.hp-r.dmg);this.aS('player','hit');Au.hit();this.sDmg('player',r.dmg,r.crit);this.bl(`${e.nm}: ${em.name}! ${r.dmg}`);this.renderB();if(p.hp<=0){this.hFaint();return;}this.battleBusy=false;this.rBA();}},

  endB(){Au.cl();this.s.inBattle=false;this.s.battleOver=false;document.getElementById('b-log').innerHTML='';this.showScreen('scr-world');setTimeout(()=>{this.renderWorld();this.updateHud();this.saveGame();},350);},
  w(ms){return new Promise(r=>setTimeout(r,ms));},

  // Team/Potions
  mkCard(p,i,sa){const c=document.createElement('div');c.className=`pk-card${sa&&i===this.s.active?' active':''}${p.hp<=0?' ko':''}`;const hp=p.mhp>0?p.hp/p.mhp:0;c.innerHTML=`<div class="c-spr">${p.spr}</div><div class="c-nm">${p.nm}</div><span class="c-type t-${p.t}">${p.t}</span><div class="c-lv">Lv.${p.lv}</div><div class="c-hp ${hp>0.5?'green':'red'}">HP:${p.hp}/${p.mhp}</div><div class="c-stats">ATK:${p.atk} DEF:${p.def} SPD:${p.spd}</div>${p.evoId?`<div style="font-size:0.55em;color:#556;margin-top:2px;">Evo Lv.${p.evoLv}</div>`:''}`;return c;},

  openTeam(){if(this.s.inBattle)return;Au.cl();document.getElementById('ov-team').classList.add('on');this.rTG();},
  closeTeam(){document.getElementById('ov-team').classList.remove('on');document.getElementById('team-detail').innerHTML='';},
  rTG(){const g=document.getElementById('team-grid');g.innerHTML='';this.s.team.forEach((p,i)=>{const c=this.mkCard(p,i,true);c.onclick=()=>{Au.cl();if(p.hp>0){this.s.active=i;this.rTG();this.updateHud();this.sTD(p);}};g.appendChild(c);});},
  sTD(p){const d=document.getElementById('team-detail');const xp=p.xpN>0?Math.min(100,p.xp/p.xpN*100):0;d.innerHTML=`<div class="pk-detail"><div class="d-spr">${p.spr}</div><div class="d-nm">${p.nm} <span class="b-type-badge t-${p.t}">${p.t}</span></div><div style="font-size:0.85em;color:#889;">Level ${p.lv}</div><div class="d-stats"><div class="d-stat"><div class="label">HP</div><div class="val">${p.hp}/${p.mhp}</div></div><div class="d-stat"><div class="label">ATK</div><div class="val">${p.atk}</div></div><div class="d-stat"><div class="label">DEF</div><div class="val">${p.def}</div></div><div class="d-stat"><div class="label">SPD</div><div class="val">${p.spd}</div></div></div><div style="font-size:0.8em;color:#889;margin:6px 0;">XP: ${p.xp}/${p.xpN}</div><div class="xp-bg" style="width:80%;margin:0 auto;"><div class="xp-fill" style="width:${xp}%"></div></div><div style="margin-top:10px">${p.moves.map(m=>`<span class="d-move">${m.name} ${m.pow}/${m.acc}%</span>`).join('')}</div>${p.evoId?`<div style="margin-top:8px;font-size:0.8em;color:#889;">Evo ab Lv.${p.evoLv}</div>`:'<div style="margin-top:8px;font-size:0.8em;color:#556;">Max. Entwicklung</div>'}</div>`;},

  openPotions(){if(this.s.inBattle)return;Au.cl();this.refreshPot();document.getElementById('ov-potions').classList.add('on');document.getElementById('pot-info').textContent=`Heiltranke: ${this.s.potions}/5 (Taglich)`;this.rPG();},
  closePotions(){document.getElementById('ov-potions').classList.remove('on');},
  rPG(){const g=document.getElementById('pot-grid');g.innerHTML='';this.s.team.forEach((p,i)=>{const need=p.hp<p.mhp;const c=this.mkCard(p,i,false);if(!need)c.classList.add('active');const info=document.createElement('div');info.style.cssText='font-size:0.7em;margin-top:4px;';if(need&&this.s.potions>0){info.textContent='Heilen';info.style.color='#4a4';c.onclick=()=>{Au.cl();p.hp=p.mhp;this.s.potions--;document.getElementById('pot-info').textContent=`Heiltranke: ${this.s.potions}/5`;this.rPG();this.updateHud();this.saveGame();};}else if(!need){info.textContent='Voll';info.style.color='#556';}else{info.textContent='Keine Tranke';info.style.color='#a33';}c.appendChild(info);g.appendChild(c);});},

  // Save/Load
  saveGame(){try{localStorage.setItem('pkmn2',JSON.stringify({char:this.s.char,team:this.s.team,active:this.s.active,potions:this.s.potions,lastPD:this.s.lastPD,battlesWon:this.s.battlesWon,px:this.s.px,py:this.s.py,map:this.s.map,mw:this.s.mw,mh:this.s.mh,seed:this.s.seed}));}catch(e){}},
  loadGame(){try{const r=localStorage.getItem('pkmn2');if(!r)return false;const d=JSON.parse(r);if(!d.char||!d.team||!d.map)return false;this.s={char:d.char,team:d.team,active:d.active||0,potions:d.potions!==undefined?d.potions:5,lastPD:d.lastPD||null,battlesWon:d.battlesWon||0,px:d.px,py:d.py,map:d.map,mw:d.mw,mh:d.mh,seed:d.seed||0,inBattle:false,battleOver:false,enemy:null};this.s.team.forEach(p=>this.rcP(p));return true;}catch(e){return false;}},

  startNewGame(){Au.cl();this.s={char:this._cc,team:[this.mkP(this._sc,5)],active:0,potions:5,lastPD:new Date().toDateString(),battlesWon:0,px:0,py:0,map:[],mw:0,mh:0,seed:0,inBattle:false,battleOver:false,enemy:null};this.genWorld();this.showScreen('scr-world');setTimeout(()=>{this.renderWorld();this.updateHud();this.saveGame();},350);},
  resumeGame(){Au.cl();this.refreshPot();if(this.s.team[this.s.active].hp<=0){const i=this.s.team.findIndex(p=>p.hp>0);if(i>=0)this.s.active=i;}this.showScreen('scr-world');setTimeout(()=>{this.renderWorld();this.updateHud();},350);},
};

G.init();
</script>
</body>
</html>
